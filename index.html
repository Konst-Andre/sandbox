<!-- живе доки: до device-підтвердження і перенесення в реальний білд QR Lens (wsd 1.8) -->
<!-- QRLens SR-Picker Stage-Bench — Крок 1: СТРУКТУРА (без каскаду/settle-glow — це Крок 2)
     Побудовано за Lens_stagebench_manifest.md, варіант phone-single-frame (§4-варіанти).
     Обидві теми мають НЕЗАЛЕЖНІ важелі (light ≠ dark за суттю, не спільний повзунок). -->
<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>SR-Picker Stage-Bench v1</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════
   BENCH CHROME — нейтральний темний "стенд", НЕ токени продукту.
   Токени продукту живуть лише всередині .phone-screen[data-theme].
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#121418}
body{font-family:'Manrope',sans-serif;color:#e7ebee;font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input{font-family:inherit}

#bench{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── toolbar (device/theme/zoom/compare) ── */
.bt-bar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 10px;background:#1a1d23;border-bottom:1px solid #2a2e36;overflow-x:auto;scrollbar-width:none}
.bt-bar::-webkit-scrollbar{display:none}
.bt-group{display:flex;align-items:center;gap:2px;background:#0f1114;border-radius:9px;padding:2px;flex-shrink:0}
.bt-btn{padding:6px 10px;border-radius:7px;font-size:11px;font-weight:700;color:#8a919c;white-space:nowrap}
.bt-btn.act{background:#2c3038;color:#7fd9cf}
.bt-sep{width:1px;height:20px;background:#2a2e36;flex-shrink:0;margin:0 2px}
.bt-zoom{display:flex;align-items:center;gap:4px;flex-shrink:0}
.bt-zoom button{width:26px;height:26px;border-radius:7px;background:#0f1114;font-weight:800;font-size:14px;color:#c7ccd3}
.bt-zoom .zv{min-width:40px;text-align:center;font-size:11px;font-weight:700;color:#8a919c;font-variant-numeric:tabular-nums}
.bt-compare{flex-shrink:0;padding:6px 12px;border-radius:8px;background:#3a2e10;color:#e6b23d;font-size:11px;font-weight:700;-webkit-user-select:none;user-select:none;touch-action:none}
.bt-compare:active,.bt-compare.held{background:#e6b23d;color:#1a1503}
.bt-copy{flex-shrink:0;padding:6px 12px;border-radius:8px;background:#12321f;color:#4fce8e;font-size:11px;font-weight:700}
.bt-copy.done{background:#4fce8e;color:#08170e}

/* ── stage (де живе телефон) ── */
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#1d2027 0%,#121418 70%)}
#stageInner{transform-origin:center center;transition:transform .18s ease}
.spec-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.04em;color:#6b7280;background:#1a1d23;padding:4px 10px;border-radius:20px;border:1px solid #2a2e36;z-index:5}

/* ── floating panel toggle (завжди видима, §3-п.8) ── */
.panel-fab{position:absolute;right:12px;bottom:12px;z-index:20;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;background:#2c3038;color:#e7ebee;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.panel-fab .cnt{font-size:10px;color:#8a919c;font-weight:600}

/* ── lever drawer (докнута знизу, НЕ оверлей стейджа, §3-п.2) ── */
#drawer{flex-shrink:0;max-height:0;overflow:hidden;background:#181b20;border-top:1px solid #2a2e36;transition:max-height .22s ease}
#drawer.open{max-height:46dvh}
.dr-inner{overflow-y:auto;max-height:46dvh;padding:10px 12px 14px}
.dr-fam{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.dr-fam::-webkit-scrollbar{display:none}
.dr-fam-btn{flex-shrink:0;padding:7px 12px;border-radius:16px;background:#0f1114;color:#8a919c;font-size:11px;font-weight:700}
.dr-fam-btn.act{background:#233a35;color:#7fd9cf}
.dr-lever{margin-bottom:14px}
.dr-lever-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.dr-lever-lbl{font-size:12px;font-weight:600;color:#c7ccd3}
.dr-lever-val{font-size:11px;font-weight:700;color:#7fd9cf;font-variant-numeric:tabular-nums;flex-shrink:0}
.dr-lever input[type=range]{width:100%;accent-color:#2A8C84;height:22px}
.dr-hint{font-size:10.5px;color:#6b7280;margin-top:1px;line-height:1.35}
.dr-lock{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px}
.dr-lock.none{background:#26292f;color:#666c76}
.dr-lock.match{background:#12321f;color:#4fce8e}
.dr-lock.drift{background:#3a2e10;color:#e6b23d}
.dr-coverage{font-size:10.5px;color:#6b7280;margin-bottom:10px}
.dr-copybox{width:100%;min-height:52px;margin-top:8px;background:#0f1114;border:1px solid #2a2e36;border-radius:8px;color:#8a919c;font-size:10px;font-family:ui-monospace,monospace;padding:8px;resize:vertical}

/* ══════════════════════════════════════════════════════════
   PHONE FRAME — реальні пропорції (§2-п.2)
   ══════════════════════════════════════════════════════════ */
.phone-frame{position:relative;background:#000;border-radius:54px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
.phone-frame[data-device="xs"]{width:397px;height:834px}
.phone-frame[data-device="15pro"]{width:415px;height:874px}
.phone-screen{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden}

/* status bar chrome */
.psb{position:absolute;top:0;left:0;right:0;z-index:80;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px;pointer-events:none;color:var(--ink)}
[data-device="xs"] .psb{height:44px;padding-bottom:8px}
[data-device="15pro"] .psb{height:52px;padding-bottom:9px}
.psb-time{font-size:15px;font-weight:700;letter-spacing:-.2px}
.psb-icons{display:flex;align-items:center;gap:4px}
.psb-icons svg{display:block}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#000;z-index:81;pointer-events:none}
[data-device="xs"] .notch{width:180px;height:26px;border-radius:0 0 18px 18px}
[data-device="15pro"] .notch{width:118px;height:34px;border-radius:20px;top:11px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.35;z-index:80;pointer-events:none}

/* ══════════════════════════════════════════════════════════
   PRODUCT TOKENS (реальні, з QR_Lens_preview_batch59) — scoped
   ══════════════════════════════════════════════════════════ */
.phone-screen[data-theme="light"]{
  --bg:#eef3f2;--bg-soft:#e3ebe9;--card:#fff;--card-2:#f4f8f7;
  --border:#d3dedb;--border-2:#bfcecb;--border-rgb:211,222,219;
  --ink:#1a1b1e;--ink-2:#3e4a46;--muted:#74827d;--muted-2:#a3afaa;
  --accent:#2A8C84;--accent-text:#237770;--accent-soft:#E8F4F2;
  --r:14px;--rs:10px;--rxs:6px;
}
.phone-screen[data-theme="dark"]{
  --bg:#0a0e14;--bg-soft:#11161e;--card:#232a35;--card-2:#2b3340;
  --border:#333b46;--border-2:#46505d;--border-rgb:51,59,70;
  --ink:#e6edf3;--ink-2:#b7c0c8;--muted:#8b949e;--muted-2:#6e7681;
  --accent:#2A8C84;--accent-text:#34A097;--accent-soft:#1A4540;
  --r:14px;--rs:10px;--rxs:6px;
}
.phone-screen{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink)}

/* ── дим-фон (мокап живого QR Lens позаду щита, §2-п.6) ── */
.mock-bg{position:absolute;inset:0;padding-top:var(--sb-space,44px)}
[data-device="15pro"] .mock-bg{--sb-space:52px}
.mock-appbar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--border)}
.mock-brand{font-size:15px;font-weight:800;color:var(--ink);flex-shrink:0}
.mock-brand em{color:var(--accent-text);font-style:normal}
.mock-srpill{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg-soft);border:1px solid var(--border);border-radius:20px;padding:5px 10px 5px 5px;cursor:pointer}
.mock-av{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.mock-srpill span{font-size:12px;font-weight:600;color:var(--ink)}
.mock-th{width:30px;height:30px;border-radius:16px;background:var(--bg-soft);border:1px solid var(--border);flex-shrink:0}
.mock-body{padding:12px 14px}
.mock-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mock-tile{height:64px;border-radius:10px;background:var(--card);border:1px solid var(--border)}

/* ── scrim + sheet ── */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.open{opacity:1;pointer-events:auto}
.pk-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;max-height:calc(100% - var(--sb-space,44px) - 30px)}
.scrim.open .pk-sheet{transform:translateY(0)}
.pk-grip-w{padding:9px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.pk-grip{width:34px;height:4px;border-radius:2px;background:var(--border-2)}
.pk-head{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px 9px;border-bottom:1px solid var(--border)}
.pk-title{font-size:14px;font-weight:700;color:var(--ink)}
.pk-x{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:13px}

/* fixed zone: search + chips — важіль pk-tray-shadow дає recess-глибину */
.pk-fixed{flex-shrink:0;background:var(--bg);box-shadow:var(--pk-tray-shadow);padding:12px 16px 10px}
.pk-search-wrap{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--pk-search-r,12px);padding:8px 10px;box-shadow:var(--pk-search-well);margin-bottom:10px}
.pk-search-wrap svg{color:var(--muted);flex-shrink:0}
.pk-search{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--ink);font-size:14px}
.pk-search::placeholder{color:var(--muted)}
.pk-clr{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--border);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:12px}
.pk-clr[hidden]{display:none}

.pk-chips{display:flex;gap:var(--pk-chip-gap,8px);overflow-x:auto;scrollbar-width:none;padding:1px 2px;transition:opacity .15s ease}
.pk-chips.dim{opacity:.35;pointer-events:none}
.pk-chips::-webkit-scrollbar{display:none}
.pk-chip-row{position:relative}
.pk-chip-row::before,.pk-chip-row::after{content:'';position:absolute;top:0;bottom:0;width:var(--pk-fade-w,20px);z-index:2;pointer-events:none}
.pk-chip-row::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
.pk-chip-row::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
.pk-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;font-weight:600;
  white-space:nowrap;background:var(--card);color:var(--ink-2)}
.pk-chip.act{background:var(--pk-chip-act-bg);color:var(--accent-text);border-color:var(--accent)}

/* scroll viewport — САМЕ ЦЕЙ ВАЖІЛЬ вирішує баг */
.pk-list-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 0;max-height:var(--pk-list-maxh,46vh)}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 2px rgba(20,40,35,.05),0 calc(1px + var(--pk-card-elev,6px)*.3) calc(4px + var(--pk-card-elev,6px)) rgba(20,40,35,.06)}
.sr-opt{display:flex;align-items:center;gap:12px;padding:var(--pk-row-pady,12px) 14px;
  border-bottom:1px solid rgba(var(--border-rgb),var(--pk-divider-a,1));cursor:pointer;color:var(--ink-2)}
.sr-opt:last-child{border-bottom:none}
.sr-opt.sel{background:rgba(var(--accent-rgb,42,140,132),var(--pk-sel-tint,0))}
.sr-av{width:var(--pk-av,34px);height:var(--pk-av,34px);border-radius:50%;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.sr-opt.sel .sr-av{box-shadow:0 0 0 var(--pk-ring,2px) var(--accent)}
.sr-opt-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.sr-opt.sel .sr-opt-name{color:var(--accent-text);font-weight:700}
.sr-check{margin-left:auto;color:var(--accent-text);opacity:0;flex-shrink:0}
.sr-opt.sel .sr-check{opacity:1}
.pk-empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px}

/* about block — статичний, поза скролом списку */
.pk-about{flex-shrink:0;padding:12px 16px 16px}
.ab-eb{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px 7px}
.about-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
.about-row:last-child{border-bottom:none}
.ar-k{color:var(--muted);font-weight:500}
.ar-v{color:var(--ink-2);font-weight:600}
</style>
</head>
<body>
<div id="bench">

  <!-- ══ TOOLBAR ══ -->
  <div class="bt-bar">
    <div class="bt-group" id="grpDevice">
      <button class="bt-btn act" data-device="xs">XS 375×812</button>
      <button class="bt-btn" data-device="15pro">15 Pro 393×852</button>
    </div>
    <div class="bt-group" id="grpTheme">
      <button class="bt-btn act" data-theme="light">☀ Світла</button>
      <button class="bt-btn" data-theme="dark">☾ Темна</button>
    </div>
    <div class="bt-sep"></div>
    <div class="bt-zoom">
      <button id="zoomOut">−</button>
      <span class="zv" id="zoomVal">100%</span>
      <button id="zoomIn">+</button>
      <button id="zoomReset" style="font-size:10px;font-weight:700">1:1</button>
    </div>
    <div class="bt-sep"></div>
    <button class="bt-compare" id="btnCompare">⇄ Порівняти з P0 (тримай)</button>
    <button class="bt-copy" id="btnCopy">📋 Скопіювати важелі</button>
  </div>

  <!-- ══ STAGE ══ -->
  <div id="stage">
    <div class="spec-badge" id="specBadge">XS · 375×812 · Світла</div>
    <div id="stageInner">
      <div class="phone-frame" data-device="xs" id="phoneFrame">
        <div class="phone-screen" data-theme="light" id="phoneScreen">
          <div class="notch"></div>
          <div class="psb">
            <span class="psb-time">9:41</span>
            <span class="psb-icons">
              <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="currentColor"/></svg>
              <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="5" rx="0.7" fill="currentColor"/></svg>
            </span>
          </div>

          <!-- живий фон позаду щита -->
          <div class="mock-bg">
            <div class="mock-appbar">
              <span class="mock-brand">QR<em>Lens</em></span>
              <button class="mock-srpill" id="mockSrPill"><span class="mock-av">К</span><span id="mockSrName">Константінов А.</span></button>
              <span class="mock-th"></span>
            </div>
            <div class="mock-body"><div class="mock-tiles"><div class="mock-tile"></div><div class="mock-tile"></div><div class="mock-tile"></div></div></div>
          </div>

          <!-- SR PICKER SHEET -->
          <div class="scrim open" id="scrim">
            <div class="pk-sheet" id="pkSheet">
              <div class="pk-grip-w"><div class="pk-grip"></div></div>
              <div class="pk-head">
                <span class="pk-title">Оберіть представника</span>
                <button class="pk-x" id="btnClose">×</button>
              </div>

              <div class="pk-fixed">
                <div class="pk-search-wrap">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
                  <input class="pk-search" id="pkSearch" type="search" placeholder="Пошук за ім'ям або прізвищем" autocomplete="off"/>
                  <button class="pk-clr" id="pkClr" hidden>×</button>
                </div>
                <div class="pk-chip-row">
                  <div class="pk-chips" id="pkChips"></div>
                </div>
              </div>

              <div class="pk-list-wrap">
                <div class="gcard" id="pkList"></div>
              </div>

              <div class="pk-about">
                <div class="ab-eb">Про застосунок</div>
                <div class="gcard">
                  <div class="about-row"><span class="ar-k">Розробник</span><span class="ar-v">Konst.Andre</span></div>
                  <div class="about-row"><span class="ar-k">Версія</span><span class="ar-v">Stage-bench · Крок 1</span></div>
                </div>
              </div>
            </div>
          </div>

          <div class="home-ind"></div>
        </div>
      </div>
    </div>
    <button class="panel-fab" id="panelFab">⚙ Важелі <span class="cnt" id="lockCnt">ЛОК 0/13</span></button>
  </div>

  <!-- ══ LEVER DRAWER ══ -->
  <div id="drawer">
    <div class="dr-inner">
      <div class="dr-coverage" id="drCoverage">Тема: <b id="drThemeLbl">Світла</b> · важелі нижче застосовуються лише до неї</div>
      <div class="dr-fam" id="drFam"></div>
      <div id="drLevers"></div>
      <textarea class="dr-copybox" id="copyBox" readonly placeholder="Тут з'явиться текст після «Скопіювати важелі» (webview інколи блокує clipboard — копіюй вручну звідси)"></textarea>
    </div>
  </div>

</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   ДАНІ — реальні 15 SR / 5 Area з _SR_List_Area.md
   ══════════════════════════════════════════════════════════ */
const AREA_DATA = [
  {area:'Київська',        people:['Негода Олександр','Трачук Олександр','Шоптенко Альона','Кімачук Оксана','Нікітіна Анна','Мошківська Надія','Леоненко Наталія']},
  {area:'Дніпропетровська',people:['Бутуліна Владислава','Константінов Андрій','Серченко Ірина']},
  {area:'Житомирська',     people:['Гончаренко Карина','Соколенко Валерія']},
  {area:'Полтавська',      people:['Дяченко Наталія','Ніна Коломієць']},
  {area:'Кіровоградська',  people:['Дуднік Вікторія']},
];
let _gid = 0;
const PEOPLE = AREA_DATA.flatMap(g => g.people.map(name => ({idx:_gid++, name, area:g.area})));
const DEFAULT_SELECTED = PEOPLE.find(p => p.name === 'Константінов Андрій');

/* ══════════════════════════════════════════════════════════
   LEVERS — 13 важелів, 5 родин, окремо для light/dark (§ manifest)
   ══════════════════════════════════════════════════════════ */
const LEVER_DEFS = [
  {key:'trayShadow',      fam:'tray',   lbl:'Глибина втоплення (шапка+search)', min:0,  max:60, step:1,   unit:'',   hint:'Recess-тінь зони search+чіпів. Формула різна для light/dark (inset shadow vs light-lip), число одне й те саме — 0=пласко, 60=глибокий колодязь.'},
  {key:'cardElevation',   fam:'tray',   lbl:'Підняття картки списку',           min:0,  max:20, step:1,   unit:'',   hint:'Наскільки список "виринає" над recess-зоною (тінь знизу картки).'},
  {key:'searchWellDepth', fam:'search', lbl:'Глибина search-поля',              min:0,  max:40, step:1,   unit:'',   hint:'Inset-тінь самого інпута (втопленість поля вводу).'},
  {key:'searchRadius',    fam:'search', lbl:'Радіус search-поля',               min:6,  max:20, step:1,   unit:'px', hint:''},
  {key:'chipFadeWidth',   fam:'chip',   lbl:'Ширина edge-fade чіпів',           min:8,  max:40, step:1,   unit:'px', hint:'Той самий трюк, що вже є в .qr-chips на Tab 3 — сигнал "можна гортати".'},
  {key:'chipActiveFillAlpha', fam:'chip', lbl:'Заливка активного чіпа',         min:0,  max:100,step:1,   unit:'%',  hint:'Скільки accent підмішано у фон вибраної Area-пігулки.'},
  {key:'chipGap',         fam:'chip',   lbl:'Відстань між чіпами',              min:4,  max:16, step:1,   unit:'px', hint:''},
  {key:'listMaxH',        fam:'list',   lbl:'Макс. висота списку (viewport)',   min:30, max:70, step:1,   unit:'vh', hint:'ГОЛОВНИЙ важіль — саме він вирішує баг "щит роздутий". Список стискається по контенту до цієї стелі, далі — внутрішній скрол.'},
  {key:'rowPadY',         fam:'list',   lbl:'Вертик. padding рядка',            min:8,  max:16, step:1,   unit:'px', hint:''},
  {key:'rowDividerAlpha', fam:'list',   lbl:'Прозорість розділювача',           min:0,  max:100,step:1,   unit:'%',  hint:''},
  {key:'avatarSize',      fam:'row',    lbl:'Розмір аватара',                   min:28, max:40, step:1,   unit:'px', hint:''},
  {key:'selectedRingWidth', fam:'row',  lbl:'Товщина кільця вибору',            min:0,  max:3,  step:0.5, unit:'px', hint:'Кільце навколо аватара вибраного представника.'},
  {key:'selectedTint',    fam:'row',    lbl:'Тонування вибраного рядка',        min:0,  max:100,step:1,   unit:'%',  hint:'Фонова підсвітка всього рядка (0 = лише кільце+колір імені, як зараз у продукті).'},
];
const FAMILIES = [
  {id:'tray',   lbl:'Шапка'},
  {id:'search', lbl:'Пошук'},
  {id:'chip',   lbl:'Чіпи'},
  {id:'list',   lbl:'Список'},
  {id:'row',    lbl:'Рядок'},
];

const P0 = {
  trayShadow:28, cardElevation:6, searchWellDepth:18, searchRadius:12,
  chipFadeWidth:20, chipActiveFillAlpha:14, chipGap:8,
  listMaxH:46, rowPadY:12, rowDividerAlpha:100,
  avatarSize:34, selectedRingWidth:2, selectedTint:0,
};
const values = {light:{...P0}, dark:{...P0}};
// ЛОК-регістр (§3-п.13): порожньо — жодного канону ще не зафіксовано на цьому стенді.
// Формат майбутнього запису: LOCK.light.listMaxH = 46;
const LOCK = {light:{}, dark:{}};

/* ══════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════ */
const state = {
  device:'xs', theme:'light', zoom:1, panelOpen:false, family:'list',
  search:'', activeArea:AREA_DATA[0].area, selectedIdx:DEFAULT_SELECTED.idx,
  sheetOpen:true,
};
// відкриваємо на Area того, хто зараз "вибраний" — консистентно з реальною поведінкою
state.activeArea = DEFAULT_SELECTED.area;

/* ══════════════════════════════════════════════════════════
   RENDER: chips
   ══════════════════════════════════════════════════════════ */
function renderChips(){
  const wrap = document.getElementById('pkChips');
  wrap.classList.toggle('dim', !!state.search.trim());
  wrap.innerHTML = AREA_DATA.map(g => `
    <button class="pk-chip${state.activeArea===g.area?' act':''}" data-area="${g.area}">${g.area} · ${g.people.length}</button>
  `).join('');
  wrap.querySelectorAll('.pk-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.activeArea = btn.dataset.area;
      renderChips(); renderList();
    });
  });
}

/* ══════════════════════════════════════════════════════════
   RENDER: people list
   ══════════════════════════════════════════════════════════ */
function renderList(){
  const el = document.getElementById('pkList');
  const q = state.search.trim().toLowerCase();
  let list;
  if(q){
    list = PEOPLE.filter(p => p.name.toLowerCase().includes(q)); // глобально, ігнорує чіп (рішення користувача)
  } else {
    list = PEOPLE.filter(p => p.area === state.activeArea);
  }
  if(!list.length){
    el.innerHTML = `<div class="pk-empty">Нічого не знайдено</div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const sel = p.idx === state.selectedIdx;
    return `<div class="sr-opt${sel?' sel':''}" data-idx="${p.idx}">
      <div class="sr-av">${p.name.charAt(0)}</div>
      <span class="sr-opt-name">${p.name}</span>
      <svg class="sr-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>`;
  }).join('');
  el.querySelectorAll('.sr-opt').forEach(row=>{
    row.addEventListener('click', ()=>{
      state.selectedIdx = +row.dataset.idx;
      const p = PEOPLE.find(x=>x.idx===state.selectedIdx);
      document.getElementById('mockSrName').textContent = p.name.split(' ')[0]+' '+p.name.split(' ')[1].charAt(0)+'.';
      renderList();
    });
  });
}

/* ══════════════════════════════════════════════════════════
   APPLY LEVERS → CSS custom properties (формула залежить від теми)
   ══════════════════════════════════════════════════════════ */
function applyLevers(){
  const v = values[state.theme];
  const screen = document.getElementById('phoneScreen');
  const isDark = state.theme === 'dark';

  const traySh = isDark
    ? `inset 0 -1px 0 rgba(255,255,255,${(v.trayShadow/150).toFixed(3)})`
    : `inset 0 1px 3px rgba(20,40,35,${(v.trayShadow/100).toFixed(3)})`;
  const searchWell = isDark
    ? `inset 0 1px 2px rgba(0,0,0,${(v.searchWellDepth/60).toFixed(3)}), inset 0 -1px 0 rgba(255,255,255,${(v.searchWellDepth/250).toFixed(3)})`
    : `inset 0 1px 3px rgba(20,40,35,${(v.searchWellDepth/100).toFixed(3)})`;

  screen.style.setProperty('--pk-tray-shadow', traySh);
  screen.style.setProperty('--pk-search-well', searchWell);
  screen.style.setProperty('--pk-search-r', v.searchRadius+'px');
  screen.style.setProperty('--pk-card-elev', v.cardElevation+'px');

  screen.style.setProperty('--pk-fade-w', v.chipFadeWidth+'px');
  screen.style.setProperty('--pk-chip-gap', v.chipGap+'px');
  screen.style.setProperty('--pk-chip-act-bg', `color-mix(in srgb, var(--accent) ${v.chipActiveFillAlpha}%, var(--card))`);

  screen.style.setProperty('--pk-list-maxh', v.listMaxH+'vh');
  screen.style.setProperty('--pk-row-pady', v.rowPadY+'px');
  screen.style.setProperty('--pk-divider-a', (v.rowDividerAlpha/100).toFixed(2));

  screen.style.setProperty('--pk-av', v.avatarSize+'px');
  screen.style.setProperty('--pk-ring', v.selectedRingWidth+'px');
  screen.style.setProperty('--accent-rgb', '42,140,132');
  screen.style.setProperty('--pk-sel-tint', (v.selectedTint/100).toFixed(2));

  renderPanel();
  updateLockCounter();
}

/* ══════════════════════════════════════════════════════════
   LEVER PANEL (family tabs + sliders + ЛОК-маркер)
   ══════════════════════════════════════════════════════════ */
function renderFamilyTabs(){
  const wrap = document.getElementById('drFam');
  wrap.innerHTML = FAMILIES.map(f=>`<button class="dr-fam-btn${state.family===f.id?' act':''}" data-f="${f.id}">${f.lbl}</button>`).join('');
  wrap.querySelectorAll('.dr-fam-btn').forEach(b=>b.addEventListener('click',()=>{state.family=b.dataset.f;renderPanel();}));
}
function lockBadge(key){
  const lock = LOCK[state.theme][key];
  const cur = values[state.theme][key];
  if(lock === undefined) return `<span class="dr-lock none">нема ЛОКу</span>`;
  if(lock === cur) return `<span class="dr-lock match">= ЛОК</span>`;
  return `<span class="dr-lock drift">ЛОК ${lock}</span>`;
}
function renderPanel(){
  document.getElementById('drThemeLbl').textContent = state.theme==='light' ? 'Світла' : 'Темна';
  const box = document.getElementById('drLevers');
  const defs = LEVER_DEFS.filter(d=>d.fam===state.family);
  box.innerHTML = defs.map(d=>{
    const v = values[state.theme][d.key];
    return `<div class="dr-lever">
      <div class="dr-lever-top">
        <span class="dr-lever-lbl">${d.lbl}${lockBadge(d.key)}</span>
        <span class="dr-lever-val">${v}${d.unit}</span>
      </div>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" data-key="${d.key}">
      ${d.hint?`<div class="dr-hint">${d.hint}</div>`:''}
    </div>`;
  }).join('');
  box.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      values[state.theme][inp.dataset.key] = parseFloat(inp.value);
      applyLevers();
    });
  });
}
function updateLockCounter(){
  const total = LEVER_DEFS.length;
  const locked = LEVER_DEFS.filter(d => LOCK[state.theme][d.key] !== undefined).length;
  document.getElementById('lockCnt').textContent = `ЛОК ${locked}/${total}`;
}

/* ══════════════════════════════════════════════════════════
   TOOLBAR: device / theme / zoom / drawer / compare / copy
   ══════════════════════════════════════════════════════════ */
document.getElementById('grpDevice').addEventListener('click', e=>{
  const b = e.target.closest('[data-device]'); if(!b) return;
  state.device = b.dataset.device;
  document.querySelectorAll('#grpDevice .bt-btn').forEach(x=>x.classList.toggle('act', x===b));
  document.getElementById('phoneFrame').dataset.device = state.device;
  document.getElementById('phoneScreen').closest('.phone-frame').dataset.device = state.device;
  document.querySelector('.notch')?.parentElement; // no-op guard
  document.getElementById('phoneFrame').setAttribute('data-device', state.device);
  document.getElementById('specBadge').textContent = specLabel();
  fitStage();
});
document.getElementById('grpTheme').addEventListener('click', e=>{
  const b = e.target.closest('[data-theme]'); if(!b) return;
  state.theme = b.dataset.theme;
  document.querySelectorAll('#grpTheme .bt-btn').forEach(x=>x.classList.toggle('act', x===b));
  document.getElementById('phoneScreen').dataset.theme = state.theme;
  document.getElementById('specBadge').textContent = specLabel();
  applyLevers();
});
function specLabel(){
  const dLbl = state.device==='xs' ? 'XS · 375×812' : '15 Pro · 393×852';
  const tLbl = state.theme==='light' ? 'Світла' : 'Темна';
  return `${dLbl} · ${tLbl}`;
}

function fitStage(){
  const stage = document.getElementById('stage');
  const inner = document.getElementById('stageInner');
  const frame = document.getElementById('phoneFrame');
  const natW = state.device==='xs' ? 397 : 415;
  const natH = state.device==='xs' ? 834 : 874;
  const avail = stage.getBoundingClientRect();
  const fit = Math.min((avail.width-24)/natW, (avail.height-24)/natH, 1);
  inner.dataset.fit = fit;
  inner.style.transform = `scale(${(fit*state.zoom).toFixed(4)})`;
  document.getElementById('zoomVal').textContent = Math.round(state.zoom*100)+'%';
}
document.getElementById('zoomIn').addEventListener('click', ()=>{state.zoom=Math.min(2.0,+(state.zoom+0.1).toFixed(2));fitStage();});
document.getElementById('zoomOut').addEventListener('click', ()=>{state.zoom=Math.max(0.6,+(state.zoom-0.1).toFixed(2));fitStage();});
document.getElementById('zoomReset').addEventListener('click', ()=>{state.zoom=1;fitStage();});
window.addEventListener('resize', fitStage);

document.getElementById('panelFab').addEventListener('click', ()=>{
  state.panelOpen = !state.panelOpen;
  document.getElementById('drawer').classList.toggle('open', state.panelOpen);
  requestAnimationFrame(fitStage); // стейдж пересчитує доступну висоту після появи/зникнення drawer
});

// hold-to-compare (§4-варіанти: phone-single-frame)
let _savedVals = null;
const btnCompare = document.getElementById('btnCompare');
function compareStart(){
  if(_savedVals) return;
  _savedVals = JSON.parse(JSON.stringify(values[state.theme]));
  values[state.theme] = {...P0};
  btnCompare.classList.add('held');
  applyLevers();
}
function compareEnd(){
  if(!_savedVals) return;
  values[state.theme] = _savedVals;
  _savedVals = null;
  btnCompare.classList.remove('held');
  applyLevers();
}
btnCompare.addEventListener('pointerdown', compareStart);
btnCompare.addEventListener('pointerup', compareEnd);
btnCompare.addEventListener('pointercancel', compareEnd);
btnCompare.addEventListener('pointerleave', compareEnd);

// copy-bet (§2-п.8): рядок + textarea fallback (webview блокує clipboard)
document.getElementById('btnCopy').addEventListener('click', ()=>{
  const fmt = t => LEVER_DEFS.map(d=>`${d.key}=${values[t][d.key]}`).join(' ');
  const text = `QRLens SRPicker stage-bench v1 | device=${state.device} theme=${state.theme}\nLIGHT: ${fmt('light')}\nDARK:  ${fmt('dark')}`;
  document.getElementById('copyBox').value = text;
  navigator.clipboard?.writeText(text).then(()=>{
    const b=document.getElementById('btnCopy'); b.classList.add('done'); b.textContent='✓ Скопійовано';
    setTimeout(()=>{b.classList.remove('done'); b.textContent='📋 Скопіювати важелі';},1600);
  }).catch(()=>{ if(!state.panelOpen){document.getElementById('panelFab').click();} });
});

/* ══════════════════════════════════════════════════════════
   SEARCH + SHEET open/close
   ══════════════════════════════════════════════════════════ */
const pkSearch = document.getElementById('pkSearch');
const pkClr = document.getElementById('pkClr');
pkSearch.addEventListener('input', e=>{
  state.search = e.target.value;
  pkClr.hidden = !state.search;
  renderChips(); renderList();
});
pkClr.addEventListener('click', ()=>{
  pkSearch.value=''; state.search=''; pkClr.hidden=true; renderChips(); renderList(); pkSearch.focus();
});

function closeSheet(){ document.getElementById('scrim').classList.remove('open'); state.sheetOpen=false; }
function openSheet(){ document.getElementById('scrim').classList.add('open'); state.sheetOpen=true; }
document.getElementById('btnClose').addEventListener('click', closeSheet);
document.getElementById('scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') closeSheet(); });
document.getElementById('mockSrPill').addEventListener('click', openSheet);

/* ══════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════ */
renderFamilyTabs();
renderChips();
renderList();
applyLevers();
fitStage();
document.getElementById('specBadge').textContent = specLabel();
</script>
</body>
</html>

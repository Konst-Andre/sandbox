<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE-Simulator — Тренажер розмови біля каси</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6B4A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
--paper:#F1F4F1; --ink:#16211C; --soft:#5E6E66; --line:#C9D2CB;
--vtm:#0F6B4A; --zf:#A0761B; --loss:#A8402B; --tape:#FBFCFA;
}
*{box-sizing:border-box}
#root{font-family:"Inter","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--ink);
background:var(--paper);min-height:100vh;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.num{font-family:"SFMono-Regular","Consolas",monospace;font-variant-numeric:tabular-nums}
.lede{max-width:60ch;margin:0 0 6px;font-size:27px;font-weight:620;letter-spacing:-.02em}
.sub{max-width:64ch;color:var(--soft);margin:0 0 22px}
.rule{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;
width:max-content;margin-bottom:8px;background:#fff}
.rule button{font:inherit;padding:8px 16px;border:none;background:#fff;cursor:pointer;color:var(--soft)}
.rule button[aria-pressed="true"]{background:var(--ink);color:#EEF2EF}
.rulenote{color:var(--soft);font-size:13px;max-width:64ch;margin:0 0 26px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{font:inherit;font-size:13.5px;padding:6px 13px;border:1px solid var(--line);
background:#fff;border-radius:20px;cursor:pointer;color:var(--soft)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#EEF2EF;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:14px 16px 16px;
text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--vtm);outline-offset:2px}
.ord{font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.card h3{margin:0;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--soft);font-size:13.5px}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);
font-size:13px;display:flex;justify-content:space-between;gap:10px}
.trap{color:var(--loss)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.back{background:none;border:none;font:inherit;color:var(--soft);cursor:pointer;padding:0;text-decoration:underline}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:22px;align-items:start}
@media(max-width:880px){.stage{grid-template-columns:1fr}}
.brief{background:#fff;border:1px solid var(--line);border-radius:3px;padding:13px 16px;margin-bottom:14px;font-size:13.5px}
.brief dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
.brief dt{color:var(--soft)}
.brief dd{margin:0}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.turn{max-width:82%;padding:10px 14px;border-radius:3px;white-space:pre-wrap}
.client{background:#fff;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--ink);color:#EEF2EF;align-self:flex-end}
.sys{align-self:center;color:var(--soft);font-size:13px;font-style:italic;text-align:center;max-width:90%}
.who{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--soft);margin-bottom:3px}
.me .who{color:#93A79B}
.composer{display:flex;gap:8px}
textarea{flex:1;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:3px;
resize:vertical;min-height:62px;background:#fff;color:inherit}
textarea:focus{outline:none;border-color:var(--vtm)}
button.send,button.primary{font:inherit;font-weight:560;padding:11px 20px;border:none;border-radius:3px;
background:var(--vtm);color:#fff;cursor:pointer}
button.send:disabled{background:var(--line);color:var(--soft);cursor:default}
button.ghost{font:inherit;padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;color:inherit}
.tape{background:var(--tape);padding:18px 18px 26px;font-size:13px;position:sticky;top:20px;
box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);
clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),92% 100%,83% calc(100% - 7px),75% 100%,66% calc(100% - 7px),58% 100%,50% calc(100% - 7px),41% 100%,33% calc(100% - 7px),25% 100%,16% calc(100% - 7px),8% 100%,0 calc(100% - 7px))}
.tape h4{margin:0 0 4px;font-size:13px;font-weight:600}
.tape .hdr{color:var(--soft);font-size:11.5px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;align-items:baseline}
.line .nm{flex:1}
.line small{display:block;color:var(--soft);font-size:11.5px}
.dash{border-top:1px dashed var(--line);margin:9px 0}
.total{font-weight:640;font-size:15px}
.tag{font-size:10.5px;padding:1px 5px;border-radius:2px;color:#fff;vertical-align:1px}
.t-vtm{background:var(--vtm)}.t-zf{background:var(--zf)}.t-none{background:#97A39B}
.star{color:var(--zf)}
.empty{color:var(--soft);font-style:italic;padding:6px 0}
.gate{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px 26px;max-width:460px}
.gate label{display:block;font-size:13px;color:var(--soft);margin:14px 0 5px}
.gate input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;color:inherit}
.gate input:focus{outline:none;border-color:var(--vtm)}
.team{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--line)}
.team th{text-align:left;font-weight:600;font-size:12px;color:#EEF2EF;background:var(--ink);padding:9px 12px}
.team td{padding:9px 12px;border-top:1px solid var(--line)}
.team td.r{text-align:right}
.tapebar{position:sticky;top:0;z-index:5;background:var(--tape);
box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.tapesum{width:100%;font:inherit;text-align:left;background:none;border:none;cursor:pointer;
padding:11px 14px;display:flex;align-items:center;gap:10px;color:inherit}
.tapesum .lbl{font-size:11.5px;color:var(--soft);display:block}
.tapesum .big{font-size:17px;font-weight:640}
.tapesum .chev{margin-left:auto;color:var(--soft);font-size:12px}
.tapebody{padding:0 14px 14px;border-top:1px dashed var(--line);font-size:13px}
.teamwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:860px){
.wrap{padding:16px 14px 40px}
.lede{font-size:22px}
.sub{font-size:14.5px;margin-bottom:18px}
.stage{grid-template-columns:1fr;gap:0}
.grid{grid-template-columns:1fr;gap:10px}
.card{padding:13px 15px 15px}
.turn{max-width:92%;padding:9px 12px}
.composer{flex-direction:column;gap:8px}
textarea{font-size:16px;min-height:56px}
button.send{width:100%;padding:14px}
button.primary,button.ghost{padding:13px 18px;font-size:15px}
.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}
.tabs button{flex:0 0 auto;padding:8px 14px}
.rule button{padding:11px 14px;font-size:14px}
.brief dl{grid-template-columns:1fr;gap:0}
.brief dt{margin-top:8px}
.brief dt:first-child{margin-top:0}
.gate{max-width:none;padding:18px 16px}
.gate input{font-size:16px;padding:12px}
.bignum{font-size:32px}
.result{padding:18px 16px}
.top{gap:8px;margin-bottom:12px}
.team{min-width:640px}
}
.result{background:#fff;border:1px solid var(--line);border-radius:3px;padding:22px 24px;margin-bottom:16px}
.bignum{font-size:40px;font-weight:640;letter-spacing:-.03em;line-height:1.1}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 16px}
.bar span{display:block;height:100%;background:var(--vtm)}
.fb{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.err{color:var(--loss)}
</style>
</head>

function pickShift(n){
const mix=a=>a.sort(()=>Math.random()-0.5);
const take=(pool,used)=>{const c=mix(pool.filter(x=>!used.has(x.id)));return c[0]||null};
const out=[],used=new Set();
[INTERNET.filter(x=>x.trap||x.noSale),
INTERNET.filter(x=>x.order.length>1),
INTERNET.filter(x=>x.grp==='Рецептурні')].forEach(pool=>{
const x=take(pool,used); if(x){out.push(x);used.add(x.id)}
});
while(out.length<n){const x=take(INTERNET,used); if(!x)break; out.push(x);used.add(x.id)}
return mix(out).slice(0,n);
}

}

async function loadEmp(key){
try {

}

async function saveRun(me, run){
const key = slug(me.pharmacy+'--'+me.name);
const prev = await loadEmp(key) || {name:me.name, pharmacy:me.pharmacy, runs:[]};
prev.name = me.name;
prev.pharmacy = me.pharmacy;
prev.runs = [...prev.runs, run].slice(-40);
localStorage.setItem('emp:'+key, JSON.stringify(prev));
}

const out = [];
for (let i = 0; i < localStorage.length; i++) {

try {
const v = localStorage.getItem(k);
if (v) out.push(JSON.parse(v));
} catch(e) {}
}
}
return out;
}

: 'Замовлення оформлюється просто зараз, при фармацевтові. Номера ще немає.';

Правила гри клієнта:
- Жива розмовна українська, короткі репліки, 1–3 речення, як реальна людина біля каси.
- Ти НЕ знаєш нічого про бонуси, ВТМ, СТМ, ЗФ чи маркетингові проєкти аптеки. Тебе цікавлять здоров'я, ціна і час.

- Якщо фармацевт мовчить або просто віддає замовлення — забираєш і йдеш.
- Розмова закінчується, коли ти розплатився або пішов. Реальна розмова біля каси — 3–7 реплік.

РОЛЬ 2: ти суддя. Після кожної репліки фіксуєш, що клієнт реально погодився купити.
Асортимент, доступний у цій розмові (код | назва):

Відповідай ЛИШЕ валідним JSON, без markdown:
{"reply":"репліка клієнта","cart":["коди позицій у чеку"],"ended":false,"endReason":"","feedback":""}

Якщо в замовленні кілька позицій, клієнт сприймає його як цілісний список: він може погодитися додати щось до списку, замінити одну позицію і залишити решту, або відмовитися від усього одразу, якщо його переконують надто наполегливо.

Початковий cart: ${JSON.stringify(sc.order)};`;
}

// Адаптовано під Groq API (OpenAI-compatible)
async function call(messages){
let r;
try {
r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'Authorization': 'Bearer ' + (localStorage.getItem('groq_api_key') || 'YOUR_API_KEY_HERE')
},
body: JSON.stringify({
model: 'qwen/qwen3-32b', // Перевірте актуальну назву моделі в Groq Console
max_tokens: 1000,
messages: messages,
response_format: { type: "json_object" }
})
});
} catch(e) {
throw new Error('Немає зв’язку з моделлю: ' + e.message);
}
let d;
try { d = await r.json(); } catch(e) { throw new Error('Відповідь не читається, код ' + r.status); }
if (!r.ok || d.error) {
throw new Error('Модель повернула помилку' + (r.status ? ' ' + r.status : '') + ': ' +
((d.error && (d.error.message || d.error.type)) || JSON.stringify(d).slice(0,200)));
}
const t = (d.choices || []).map(x => x.message?.content || '').join('').trim();
if (!t) throw new Error('Модель відповіла порожнім текстом');
return t;
}

function extractJSON(t){
const a = t.indexOf('{'), b = t.lastIndexOf('}');
if (a < 0 || b <= a) throw new Error('Відповідь без JSON: ' + t.slice(0,140));
return JSON.parse(t.slice(a, b+1));
}

function toMessages(sc, pot, history){
const sys = buildSystem(sc, pot);
const msgs = [{ role: 'system', content: sys }];
history.forEach(m => {
const role = m.role === 'user' ? 'user' : 'assistant';
msgs.push({ role: role, content: m.content || m.t || '' });
});
return msgs;
}

async function ask(sc, pot, history){
const msgs = toMessages(sc, pot, history);
let t = await call(msgs);
try {
return extractJSON(t);
} catch(e){
const t2 = await call([...msgs, {role: 'assistant', content: t},
{role: 'user', content: 'Поверни лише JSON-об’єкт із полями reply, cart, ended, endReason, feedback. Без пояснень і без markdown.'}]);
return extractJSON(t2);
}
}

async function synthesize(rows){
const body = rows.map((r,i) =>
`Замовлення ${i+1}. «${r.sc.title}»${r.sc.no ? ', № ' + r.sc.no : ''}.\n` +
`У списку: ${r.sc.order.map(c => ALL[c].n).join('; ') || 'нічого'}.\n` +
(r.sc.noSale
? `Правильна дія — нічого не міняти. Фармацевт ${r.delta > 0 ? 'усе-таки змінив чек' : 'чек не змінив'}.\n`
: `Приріст ${uah(r.delta)} ₴ з орієнтира ${r.pot} ₴.\n`) +
`Розбір розмови: ${r.fb || '—'}`).join('\n\n');

const prompt = `Ти — наставник фармацевтів аптечної мережі. Співробітник щойно відпрацював зміну з п’яти інтернет-замовлень. Завдання було: фармазаміна на власну марку і додатковий продаж до замовлення.
${body}
Дай розбір усієї зміни цілком. Пиши українською, звертайся на «ви», без загальних слів і без похвали заради похвали. Спирайся тільки на те, що описано вище.
Відповідай ЛИШЕ валідним JSON, без markdown:
{"overall":"2–3 речення загальної оцінки зміни",
"mistakes":["до трьох повторюваних помилок, конкретно"],
"strengths":["до двох речей, що вийшли добре"],
"rules":["три правила роботи з інтернет-замовленнями, які саме цій людині варто застосувати наступного разу"],
"curator":"1–2 речення для куратора: на що звернути увагу з цим співробітником і як опрацьовувати далі"}`;

const t = await call([{role: 'user', content: prompt}]);
return extractJSON(t);
}

async function ping(){
const t = await call([{role: 'user', content: 'Відповідай одним словом: працює'}]);
return t.slice(0,60);
}

function Game({sc, rule, onBack, shift, onNext}){
const narrow = useNarrow();
const pot = potential(sc, rule);
const [log, setLog] = useState([{who: 'client', t: sc.open}]);
const [cart, setCart] = useState(sc.order);
const [draft, setDraft] = useState('');
const [busy, setBusy] = useState(false);
const [done, setDone] = useState(null);
const [err, setErr] = useState('');
const hist = useRef([]), end = useRef(null), lastLine = useRef('');

useEffect(() => {
if (end.current) end.current.scrollIntoView({behavior: 'smooth', block: 'end'});
}, [log, done]);

async function send(){
const line = draft.trim();
if (!line || busy || done) return;
setDraft('');
setErr('');
lastLine.current = line;
setLog(l => [...l, {who: 'me', t: line}]);
hist.current.push({role: 'user', content: line});
setBusy(true);
try {
const res = await ask(sc, pot, hist.current);
hist.current.push({role: 'assistant', content: JSON.stringify(res)});
setLog(l => [...l, {who: 'client', t: res.reply}]);
if (Array.isArray(res.cart)) setCart(res.cart.filter(c => ALL[c]));
if (res.ended) setDone({reason: res.endReason, fb: res.feedback});
} catch(e){
setErr(e.message || String(e));
hist.current.pop();
setLog(l => l.slice(0, -1));
}
setBusy(false);
}

const delta = bonusOf(cart) - bonusOf(sc.order);
const pct = sc.noSale ? (delta <= 0 ? 100 : 0) : Math.max(0, Math.min(100, Math.round(delta / pot * 100)));

return h('div', {className: 'wrap'}, [
h('div', {className: 'top', key: 't'}, [

shift ? h('span', {key: 'sh', style: {color: 'var(--soft)', fontSize: '14px'}},
`клієнт ${shift.n} з ${shift.total}`) : null,
h('button', {className: 'back', key: 'b', onClick: onBack}, 'вийти')]),
narrow ? h(Tape, {sc, cart, pot, compact: true, key: 'tapeTop'}) : null,
h('div', {className: 'stage', key: 's'}, [

h('dd', {key: 2}, sc.order.length
? (sc.order.length > 1
? h('ol', {style: {margin: '2px 0 0', paddingLeft: 18}},
sc.order.map((c,i) => h('li', {key: i, style: {marginBottom: 2}}, ALL[c].n)))
: ALL[sc.order[0]].n)
: 'нічого, клієнт прийшов без замовлення'),
h('dt', {key: 3}, 'Клієнт'), h('dd', {key: 4}, sc.who + '. ' + sc.mood),
h('dt', {key: 5}, 'Режим'), h('dd', {key: 6}, sc.mode),
h('dt', {key: 7}, 'Тренуємо'), h('dd', {key: 8}, sc.goal)])),
h('div', {className: 'log', key: 'lg'}, [
...log.map((m,i) => h('div', {className: 'turn ' + m.who, key: i}, [
h('span', {className: 'who', key: 'w'}, m.who === 'me' ? 'Ви' : 'Клієнт'), m.t])),
busy ? h('div', {className: 'sys', key: 'b'}, 'клієнт думає…') : null,
err ? h('div', {className: 'sys err', key: 'e'}, [
h('div', {key: 1, style: {fontStyle: 'normal', fontWeight: 600}}, 'Репліку не надіслано'),
h('div', {key: 2, style: {fontSize: '12px', marginTop: 4}}, err),
h('div', {key: 3, style: {marginTop: 8}},
h('button', {className: 'ghost', onClick: () => {setDraft(lastLine.current); setErr('')}},
'Повернути текст і спробувати ще'))]) : null]),
done ? h('div', {className: 'result', key: 'r'}, [
h('div', {key: 'a', style: {color: 'var(--soft)', fontSize: '13.5px'}},
done.reason === 'left' ? 'Клієнт пішов' : 'Клієнт розплатився'),
h('div', {className: 'bignum num', key: 'b'}, (delta > 0 ? '+' : '') + uah(delta) + ' ₴'),
h('div', {className: 'bar', key: 'c'}, h('span', {style: {width: pct + '%'}})),
h('div', {key: 'd', style: {fontSize: '13.5px', color: 'var(--soft)'}},
sc.noSale
? (delta <= 0 ? 'Чек не змінився — так і мало бути.'
: 'Чек змінився. У цьому сценарії заміна була неправильною дією.')
: `${pct}% від орієнтира (≈ ${pot} ₴ за правилом «${rule === 'vtm' ? 'ВТМ пріоритетний' : 'максимальна дельта'}»))`),
h('div', {className: 'fb', key: 'e'}, done.fb),
h('div', {key: 'g', style: {marginTop: 14, paddingTop: 12, borderTop: '1px dashed var(--line)', fontSize: '13.5px', color: 'var(--soft)'}},
sc.noSale

: ['Ідеальний чек за цим правилом: ', h('span', {key: 'x', style: {color: 'var(--ink)'}},
idealOf(sc, rule).map(c => ALL[c].n).join(' + '))]),
h('div', {key: 'f', style: {marginTop: 16, display: 'flex', gap: 8}},
shift

h('button', {className: 'ghost', key: 2, onClick: onBack}, 'Вийти')]
: [h('button', {className: 'primary', key: 1, onClick: () => window.location.reload()}, 'Пройти ще раз'),
h('button', {className: 'ghost', key: 2, onClick: onBack}, 'Інший сценарій')])])
: h('div', {className: 'composer', key: 'c'}, [

onChange: e => setDraft(e.target.value),
onKeyDown: e => {if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || narrow) && !e.shiftKey) {e.preventDefault(); send()}}}),
h('button', {className: 'send', key: 'b', onClick: send, disabled: busy || !draft.trim()}, 'Сказати')]),
h('div', {ref: end, key: 'anchor'})]),
narrow ? null : h(Tape, {sc, cart, pot, key: 'tape'})])]);
}

function ShiftResult({rows, me, onBack}){
const scored = rows.filter(r => !r.sc.noSale);
const got = scored.reduce((a,r) => a + r.delta, 0);
const pot = scored.reduce((a,r) => a + r.pot, 0) || 1;
const pct = Math.max(0, Math.min(100, Math.round(got / pot * 100)));
const slips = rows.filter(r => r.delta < 0 || (r.sc.noSale && r.delta > 0));
const [an, setAn] = useState(null), [st, setSt] = useState('work');

useEffect(() => {(async () => {
let a = null;
try {
a = await synthesize(rows);
setAn(a);
} catch(e) {
setSt('nofb');
}
try {
await saveRun(me, {date: new Date().toISOString().slice(0,16).replace('T',' '),
got: Math.round(got * 100) / 100, pot: Math.round(pot), slips: slips.length, clients: rows.length,
pct, orders: rows.map(r => ({no: r.sc.no, title: r.sc.title, delta: Math.round(r.delta * 100) / 100,
pot: r.sc.noSale ? null : r.pot})),
overall: a ? a.overall : '', mistakes: a ? a.mistakes : [], rules: a ? a.rules : [],
curator: a ? a.curator : ''});
setSt(x => x === 'nofb' ? 'nofb' : 'ok');
} catch(e) {
setSt('nosave');
}
})()}, []);

const bullets = (t, arr) => arr && arr.length ? h('div', {style: {marginTop: 16}}, [
h('div', {key: 1, style: {fontSize: '12px', letterSpacing: '.04em', color: 'var(--soft)', marginBottom: 6}}, t),

return h('div', {className: 'wrap'}, [

h('div', {className: 'result', key: 'r'}, [

rows.length + ' інтернет-замовлень'),
h('div', {className: 'bignum num', key: 'b', style: {color: got < 0 ? 'var(--loss)' : 'inherit'}},
(got > 0 ? '+' : '') + uah(got) + ' ₴'),

h('div', {key: 'd', style: {fontSize: '13.5px', color: 'var(--soft)'}},
pct + '% від того, що ця зміна могла дати (' + Math.round(pot) + ' ₴)'),
h('table', {key: 't', style: {width: '100%', marginTop: 18, borderCollapse: 'collapse', fontSize: '13.5px'}},
h('tbody', {}, rows.map((r,i) => h('tr', {key: i, style: {borderTop: '1px dashed var(--line)'}}, [
h('td', {key: 1, className: 'num', style: {padding: '7px 0', color: 'var(--soft)', width: 62}}, '№ ' + r.sc.no),
h('td', {key: 2, style: {padding: '7px 0'}}, r.sc.title),
h('td', {key: 3, className: 'num', style: {padding: '7px 0', textAlign: 'right',
color: r.delta < 0 ? 'var(--loss)' : r.delta > 0 ? 'var(--vtm)' : 'var(--soft)'}},
r.sc.noSale ? (r.delta > 0 ? 'заміна зайва' : 'вірно') : (r.delta > 0 ? '+' : '') + uah(r.delta)),
h('td', {key: 4, className: 'num', style: {padding: '7px 0 7px 12px', textAlign: 'right',
color: 'var(--soft)', width: 66}}, r.sc.noSale ? '—' : 'з ' + r.pot)])))),
slips.length ? h('p', {key: 'l', style: {marginTop: 14, color: 'var(--loss)', fontSize: '13.5px'}},
'Заміна зменшила бонус або була зайвою у ' + slips.length + ': ' + slips.map(r => r.sc.title).join(', ') + '.') : null,
h('div', {key: 'fb', style: {borderTop: '1px solid var(--line)', marginTop: 18, paddingTop: 16}},
an ? [
h('p', {key: 0, style: {marginTop: 0}}, an.overall),
bullets('Що повторюється', an.mistakes),
bullets('Що вийшло', an.strengths),
bullets('На наступну зміну', an.rules)]
: st === 'nofb'
? h('p', {className: 'err', style: {margin: 0, fontSize: '13.5px'}}, 'Підсумковий розбір не сформувався. Результат зміни збережено.')
: h('p', {className: 'sys', style: {margin: 0}}, 'Готую розбір зміни…')),
h('p', {key: 'sv', style: {marginTop: 14, fontSize: '12.5px',

: 'Орієнтир рахується по всьому асортименту з бонусом. Економічно чесно, але рамка «пропонуємо своє» зникає — ВТМ і ЗФ стають рівні.'),

h('div', {className: 'grid', key: 'g'}, list.map(sc =>

h('h3', {key: 1}, sc.title),
h('p', {key: 2}, sc.who + '. ' + sc.mood),
h('div', {className: 'cardfoot', key: 3}, [
h('span', {key: 'a', style: {color: 'var(--soft)'}},
sc.trap ? h('em', {className: 'trap'}, 'пастка') : sc.noSale ? h('em', {}, 'без продажу') : sc.mode),
h('span', {className: 'num', key: 'b'}, sc.noSale ? '—' : '≈ ' + potential(sc, rule) + ' ₴')])]))
]);
}

function App(){
const [me, setMe] = useState(null);
const [view, setView] = useState('brief');
const [sc, setSc] = useState(null);
const [shift, setShift] = useState(null);
const [rule, setRule] = useState(RULE);

function startShift(){
const q = pickShift(5);
setShift({queue: q, idx: 0, rows: []});
setSc(q[0]);
setView('game');
}

function nextClient(delta, pot, fb){
const rows = [...shift.rows, {sc, delta, pot, fb}];
const idx = shift.idx + 1;
if (idx >= shift.queue.length) {
setShift({...shift, rows, done: true});
setSc(null);
} else {
setShift({...shift, idx, rows});
setSc(shift.queue[idx]);
}
}

const reset = () => {setMe(null); setShift(null); setSc(null); setView('brief')};

if (view === 'curator') return h(Curator, {onBack: () => {setView('brief')}});
if (!me) return h(Gate, {onReady: setMe, onCurator: () => setView('curator')});
if (shift && shift.done) return h(ShiftResult, {rows: shift.rows, me, onBack: reset});
if (sc) return h(Game, {sc, rule, onBack: reset, onNext: nextClient,
shift: {n: shift.idx + 1, total: shift.queue.length}, key: sc.id});
return h(Picker, {rule, setRule, onPick: sc => {setSc(sc); setView('game')}, onShift: startShift, onTeam: () => setView('curator'), me});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>

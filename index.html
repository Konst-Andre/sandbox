<!doctype html>
<!-- QRLens_areachip_stagebench_v2_1.html
     живе доки: доки модель + числа Area-чіпа не залочені на девайсі (XS+15Pro, обидві теми)
                і не портовані в QR_Lens_preview_batch59.html; тоді → archive/stands/
     v2.3 (крок 4-5): повний реєстр важелів-повзунків + ЛОК + copy-bet + pan при зумі.
     Пресети (модель/OFF/навіс/таця) лишились — вони тепер ПИШУТЬ у важелі, а не окремий CSS.
     Кожен матеріальний параметр — ЧИСЛО. Поверхні складені з шарів dk/lt поверх базового
     токена → тон керується однаково у світлій і темній (фікс паритету, device-фідбек 11.08).
-->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Area-chip stage-bench v2.3</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:#14161a;color:#e8eaed;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
.bb{flex-shrink:0;background:#1b1e24;border-bottom:1px solid #2a2e36;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 9px 6px;display:flex;flex-direction:column;gap:5px}
.bb-r{display:flex;align-items:center;gap:5px}
.bb-t{font:800 10px 'Manrope',sans-serif;letter-spacing:.2px;color:#9aa4b0;flex-shrink:0}
.sp{flex:1}
.btn{border:1px solid #3a4049;background:#252a32;color:#e8eaed;border-radius:7px;
  padding:5px 8px;font:700 10.5px 'Manrope',sans-serif;cursor:pointer;white-space:nowrap;user-select:none}
.btn:active{background:#30363f}
.btn.on{background:#2A8C84;border-color:#2A8C84;color:#fff}
.btn.hold{background:#6b5426;border-color:#8a6d31}
.seg{display:flex;border:1px solid #3a4049;border-radius:7px;overflow:hidden;flex-shrink:0}
.seg .btn{border:none;border-radius:0;border-right:1px solid #3a4049}
.seg .btn:last-child{border-right:none}
.zb{font:800 10px 'Manrope',sans-serif;color:#7f8b98;min-width:34px;text-align:center}

/* стейдж: скролиться при зумі (device-фідбек: «не можу дотягнутись до зони») */
#stageWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 90% at 50% 0%,#1b1f26 0%,#101216 100%)}
#stagePad{display:flex;align-items:center;justify-content:center;min-width:100%;min-height:100%}
.frame{position:relative;flex-shrink:0;transform-origin:center center;
  background:#0b0c0e;border-radius:var(--fr-rad);padding:var(--fr-bez);
  box-shadow:0 0 0 1.5px #33383f,0 18px 40px rgba(0,0,0,.55)}
.screenbox{position:relative;width:var(--scr-w);height:var(--scr-h);overflow:hidden;
  border-radius:calc(var(--fr-rad) - var(--fr-bez));background:var(--bg)}
.cut{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#000;z-index:40}
.stage[data-dev="xs"] .cut{width:154px;height:30px;border-radius:0 0 20px 20px}
.stage[data-dev="p15"] .cut{width:120px;height:34px;top:11px;border-radius:20px}
.homeind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;
  border-radius:3px;background:var(--ink);opacity:.28;z-index:41}
.stbar{position:absolute;top:0;left:0;right:0;height:var(--sa-t);z-index:39;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;
  font:700 13px 'Manrope',sans-serif;color:var(--ink);pointer-events:none}

/* ═══ токени B59 (grep-верифіковано) ═══ */
.stage{--accent:#2A8C84;--acc-rgb:42,140,132}
.stage[data-th="light"]{
  --bg:#eef3f2;--bg-soft:#e3ebe9;--card:#fff;--card-2:#f4f8f7;
  --border:#d3dedb;--border-2:#bfcecb;
  --ink:#1a1b1e;--ink-2:#3e4a46;--muted:#74827d;--muted-2:#a3afaa;--accent-text:#237770;
  --av-bg:color-mix(in srgb,var(--accent) 15%,var(--card));--av-ink:#237770;
  --av-sh:0 2.5px 5px -1px rgba(0,0,0,.22);--div-c:0,0,0}
.stage[data-th="dark"]{
  --bg:#0a0e14;--bg-soft:#11161e;--card:#232a35;--card-2:#2b3340;
  --border:#333b46;--border-2:#46505d;
  --ink:#e6edf3;--ink-2:#b7c0c8;--muted:#8b949e;--muted-2:#6e7681;--accent-text:#34A097;
  --av-bg:color-mix(in srgb,var(--accent) 18%,var(--card));--av-ink:#45A194;
  --av-sh:inset 0 1px 0 rgba(255,255,255,.158),inset 0 -1px 0 rgba(0,0,0,.22);--div-c:255,255,255}

/* ═══ контент позаду ═══ */
.behind{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.bh-bar{padding:calc(var(--sa-t) + 4px) 14px 8px;background:var(--card);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.bh-logo{width:26px;height:26px;border-radius:7px;background:color-mix(in srgb,var(--accent) 14%,var(--card));
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);flex-shrink:0}
.bh-wm{font:800 15px 'Manrope',sans-serif;color:var(--ink)}
.bh-wm i{color:var(--accent-text);font-style:normal}
.bh-pill{flex:1;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;
  background:var(--bg-soft);border:1px solid var(--border);font:600 12px 'Manrope',sans-serif;color:var(--ink-2)}
.bh-av{width:20px;height:20px;border-radius:50%;background:var(--av-bg);color:var(--av-ink);
  font:800 9px 'Manrope',sans-serif;display:flex;align-items:center;justify-content:center}
.bh-sub{padding:5px 16px 9px;font:600 11px 'Manrope',sans-serif;color:var(--muted);
  background:var(--card);display:flex;align-items:center;gap:6px}
.bh-dot{width:7px;height:7px;border-radius:50%;background:#2e9e5c}
.bh-card{margin:9px 14px;padding:12px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);height:62px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:10}

/* ═══ SHEET ═══ */
.sh-head{border-bottom:calc(var(--eave-h)*1px) solid rgba(var(--div-c),calc(var(--eave-a)/100))}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;display:flex;flex-direction:column;
  height:calc(var(--sheet-h)*1%);
  background:var(--card);
  border-radius:calc(var(--sheet-rad)*1px) calc(var(--sheet-rad)*1px) 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,calc(var(--sheet-drop-a)/100));
  padding-bottom:var(--sa-b);overflow:hidden}
.sh-grip-w{padding:10px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.sh-grip{width:36px;height:4px;background:var(--border-2);border-radius:2px}
.sh-head{display:flex;justify-content:space-between;align-items:center;
  padding:0 16px calc(var(--head-padb)*1px);flex-shrink:0}
.sh-title{font:700 15px 'Manrope',sans-serif;color:var(--ink)}
.sh-x{width:28px;height:28px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:14px}

/* НАВІС */
.eave{flex-shrink:0;height:calc(var(--eave-h)*1px);position:relative;
  background:rgba(var(--div-c),calc(var(--eave-a)/100))}
.eave::after{content:"";position:absolute;left:0;right:0;top:100%;
  height:calc(var(--eave-sh-h)*1px);pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,calc(var(--eave-sh-a)/100)),rgba(0,0,0,0))}

/* ТАРЕЛЬ .sh-body — реальний матеріал B56 (р.775-777):
   світла bg #eef3f2 + inset 0 1px 3px rgba(20,40,35,.28) · темна bg-soft #11161e + нижня біла губа .28.
   Саме він дає ту тональність, якої в стенді бракувало (device-фідбек 11.08). */
.sh-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:calc(var(--tarel-padt)*1px) calc(var(--tarel-padx)*1px) calc(var(--tarel-padb)*1px);
  background:
    linear-gradient(rgba(0,0,0,calc(var(--tarel-dk)/100)),rgba(0,0,0,calc(var(--tarel-dk)/100))),
    linear-gradient(rgba(255,255,255,calc(var(--tarel-lt)/100)),rgba(255,255,255,calc(var(--tarel-lt)/100))),
    var(--tarel-base);
  box-shadow:
    inset 0 calc(var(--tarel-ins-y)*1px) calc(var(--tarel-ins-b)*1px) rgba(20,40,35,calc(var(--tarel-ins-a)/100)),
    inset 0 -1px 0 rgba(255,255,255,calc(var(--tarel-lip-a)/100))}
.stage[data-th="light"]{--tarel-base:var(--bg)}
.stage[data-th="dark"]{--tarel-base:var(--bg-soft)}

/* ТУНЕЛЬ — база = ТАРЕЛЬ (dk=lt=0 → таця зливається з дошкою) */
.tray-w{flex-shrink:0;padding:calc(var(--tray-mt)*1px) 0 calc(var(--tray-mb)*1px)}
.tray{display:flex;gap:calc(var(--tray-gap)*1px);align-items:center;
  margin:0 calc(var(--tray-mx)*1px);
  padding:calc(var(--tray-padt)*1px) 10px calc(var(--tray-padb)*1px);
  border-radius:calc(var(--tray-rad)*1px);overflow-x:auto;scrollbar-width:none;
  background:
    linear-gradient(rgba(0,0,0,calc(var(--tray-dk)/100)),rgba(0,0,0,calc(var(--tray-dk)/100))),
    linear-gradient(rgba(255,255,255,calc(var(--tray-lt)/100)),rgba(255,255,255,calc(var(--tray-lt)/100))),
    var(--tarel-base);
  box-shadow:
    inset 0 2px calc(var(--tray-ins-b)*1px) rgba(0,0,0,calc(var(--tray-ins-a)/100)),
    inset 0 -1px 0 rgba(255,255,255,calc(var(--tray-lip-a)/100)),
    0 calc(var(--tray-drop-y)*1px) calc(var(--tray-drop-b)*1px) rgba(0,0,0,calc(var(--tray-drop-a)/100));
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 calc(var(--tray-fade)*1px),#000 calc(100% - var(--tray-fade)*1px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 calc(var(--tray-fade)*1px),#000 calc(100% - var(--tray-fade)*1px),transparent 100%)}
.tray::-webkit-scrollbar{display:none}

/* ЧІП: halo-wrapper + капсула. halo завжди в DOM → перенос не зсуває сусідів */
.ac{flex-shrink:0;display:inline-flex;padding:calc(var(--halo-gap)*1px);
  border:calc(var(--halo-w)*1px) solid color-mix(in srgb,var(--accent) calc(var(--halo-acc)*1%),transparent);
  border-radius:calc((var(--cap-rad) + var(--halo-gap) + var(--halo-w) + var(--halo-rad-d))*1px);
  background:
    linear-gradient(rgba(0,0,0,calc(var(--halo-dk)/100)),rgba(0,0,0,calc(var(--halo-dk)/100))),
    linear-gradient(rgba(255,255,255,calc(var(--halo-lt)/100)),rgba(255,255,255,calc(var(--halo-lt)/100))),
    transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--halo-lip-a)/100)),
             0 1px 2px rgba(0,0,0,calc(var(--halo-drop-a)/100));
  cursor:pointer}
.ac:not(.on){--halo-acc:0;--halo-dk:0;--halo-lt:0;--halo-lip-a:0;--halo-drop-a:0}
.ac-cap{display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  padding:calc(var(--cap-pady)*1px) calc(var(--cap-padx)*1px);
  min-height:calc(var(--cap-minh)*1px);
  border-radius:calc(var(--cap-rad)*1px);
  border:calc(var(--cap-bw)*1px) solid color-mix(in srgb,var(--accent) calc(var(--cap-bd)*1%),var(--border));
  background:
    linear-gradient(rgba(var(--acc-rgb),calc(var(--cap-tint)/100)),rgba(var(--acc-rgb),calc(var(--cap-tint)/100))),
    linear-gradient(rgba(0,0,0,calc(var(--cap-dk)/100)),rgba(0,0,0,calc(var(--cap-dk)/100))),
    linear-gradient(rgba(255,255,255,calc(var(--cap-lt)/100)),rgba(255,255,255,calc(var(--cap-lt)/100))),
    var(--card);
  color:color-mix(in srgb,var(--ink) calc(var(--cap-txtw)*1%),
        color-mix(in srgb,var(--accent-text) calc(var(--cap-txt)*1%),var(--ink-2)));
  font-family:'Manrope',sans-serif;font-size:calc(var(--cap-fs)*1px);font-weight:var(--cap-fw);
  box-shadow:
    inset 0 calc(var(--cap-ins-y)*1px) calc(var(--cap-ins-b)*1px) rgba(0,0,0,calc(var(--cap-ins-a)/100)),
    inset 0 calc(var(--cap-lip-y)*1px) 0 rgba(255,255,255,calc(var(--cap-lip-a)/100)),
    0 calc(var(--cap-drop-y)*1px) calc(var(--cap-drop-b)*1px) rgba(0,0,0,calc(var(--cap-drop-a)/100))}
.ac-n{opacity:.72;font-weight:600}

/* СПИСОК + ДІВАЙДЕР (важелі: inset зліва/справа, товщина, прозорість) */
.sh-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0}
.sh-list::-webkit-scrollbar{display:none}
.gcard{border-radius:calc(var(--gc-rad)*1px);overflow:hidden;
  border:1px solid color-mix(in srgb,var(--border) calc(var(--gc-bd)*1%),transparent);
  background:
    linear-gradient(rgba(0,0,0,calc(var(--gc-dk)/100)),rgba(0,0,0,calc(var(--gc-dk)/100))),
    linear-gradient(rgba(255,255,255,calc(var(--gc-lt)/100)),rgba(255,255,255,calc(var(--gc-lt)/100))),
    var(--card);
  box-shadow:0 3px 8px rgba(0,0,0,calc(var(--gc-drop-a)/100))}
.sr-opt{position:relative;display:flex;align-items:center;gap:12px;
  padding:calc(var(--row-pady)*1px) 14px;color:var(--ink-2)}
.sr-opt::after{content:"";position:absolute;bottom:0;
  left:calc(var(--div-l)*1px);right:calc(var(--div-r)*1px);
  height:calc(var(--div-h)*1px);background:rgba(var(--div-c),calc(var(--div-a)/100))}
.sr-opt:last-child::after{display:none}
.sr-av{width:34px;height:34px;border-radius:50%;background:var(--av-bg);color:var(--av-ink);
  box-shadow:var(--av-sh);display:flex;align-items:center;justify-content:center;
  font:800 14px 'Manrope',sans-serif;flex-shrink:0}
.sr-n{font:600 14px 'Manrope',sans-serif;flex:1;min-width:0}
.sr-opt.sel .sr-av{box-shadow:0 0 0 2px var(--accent),var(--av-sh)}
.sr-opt.sel .sr-n{color:var(--accent);font-weight:700}
.sh-eyebrow{font:700 10px 'Manrope',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 2px 6px}

/* ═══ ПАНЕЛЬ ═══ */
#panel{flex-shrink:0;background:#1b1e24;border-top:1px solid #2a2e36;
  padding:6px 9px calc(env(safe-area-inset-bottom,0px) + 6px);
  display:flex;flex-direction:column;gap:5px;max-height:46dvh}
#panel.hidden{display:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.presets{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex-shrink:0}
.pl{font:800 9px 'Manrope',sans-serif;color:#7f8b98;letter-spacing:.05em;
  text-transform:uppercase;min-width:44px;flex-shrink:0}
#levers{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.lv{display:flex;align-items:center;gap:6px}
.lv-n{font:700 9.5px 'Manrope',sans-serif;color:#a6b1bd;width:74px;flex-shrink:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-s{flex:1;min-width:0;height:22px;accent-color:#2A8C84;background:transparent}
.lv-v{font:800 9.5px 'Manrope',sans-serif;color:#e8eaed;width:38px;text-align:right;flex-shrink:0}
.lv-k{font-size:11px;width:20px;text-align:center;flex-shrink:0;opacity:.45;cursor:pointer;
  background:none;border:none;color:#e8eaed;padding:0}
.lv-k.lk{opacity:1;color:#f0c25a}
.lv.drift .lv-v{color:#f0c25a}
.leg{font:500 9.5px/1.4 'Manrope',sans-serif;color:#7d8794;border-top:1px solid #2a2e36;padding-top:5px;
  max-height:38dvh;overflow-y:auto;flex-shrink:0}
.leg.hidden{display:none}
.leg b{color:#9fb0bd;font-weight:800}
#showPanel{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:90;display:none}
#showPanel.on{display:block}
#betBox{position:fixed;inset:8% 6%;z-index:99;background:#11141a;border:1px solid #3a4049;
  border-radius:12px;padding:10px;display:none;flex-direction:column;gap:7px}
#betBox.on{display:flex}
#betTxt{flex:1;width:100%;background:#0b0d11;color:#cfd6de;border:1px solid #2a2e36;border-radius:8px;
  font:500 10px/1.4 ui-monospace,monospace;padding:8px;resize:none}
</style>
</head>
<body>

<div class="bb" id="bb">
  <div class="bb-r">
    <span class="bb-t">AREA-CHIP v2.3</span>
    <div class="seg"><button class="btn on" data-dev="xs">XS</button><button class="btn" data-dev="p15">15 Pro</button></div>
    <button class="btn" id="thBtn">☀︎ світла</button>
    <span class="sp"></span>
    <button class="btn" id="hideBtn">⤢</button>
  </div>
  <div class="bb-r">
    <button class="btn" data-z="minus">−</button><span class="zb" id="zb">100%</span>
    <button class="btn" data-z="plus">+</button><button class="btn" data-z="one">fit</button>
    <span class="sp"></span>
    <button class="btn" id="holdBtn">✋ lift</button>
    <button class="btn" id="betBtn">📋</button>
    <button class="btn" id="legBtn">?</button>
    <span class="zb" id="lockN">🔒0</span>
  </div>
</div>

<div id="stageWrap"><div id="stagePad">
  <div class="stage frame" id="stage" data-dev="xs" data-th="light">
    <div class="screenbox">
      <div class="behind">
        <div class="bh-bar"><div class="bh-logo"></div><div class="bh-wm"><i>QR</i>Lens</div>
          <div class="bh-pill"><span class="bh-av">К</span>Константінов А.</div></div>
        <div class="bh-sub"><span class="bh-dot"></span>Оновлено: 10.08.2026</div>
        <div class="bh-card"></div><div class="bh-card"></div><div class="bh-card"></div>
      </div>
      <div class="stbar"><span>15:59</span><span>LTE ▮</span></div>
      <div class="cut"></div><div class="dim"></div>
      <div class="sheet" id="sheet">
        <div class="sh-grip-w"><div class="sh-grip"></div></div>
        <div class="sh-head"><div class="sh-title">Оберіть представника</div><div class="sh-x">✕</div></div>
        <div class="eave"></div>
        <div class="sh-body">
        <div class="tray-w"><div class="tray" id="tray"></div></div>
        <div class="sh-list"><div class="gcard" id="srList"></div>
          <div class="sh-eyebrow">Про застосунок</div>
          <div class="gcard"><div class="sr-opt"><span class="sr-n" style="color:var(--muted)">Розробник</span><span style="font:600 14px Manrope,sans-serif">Konst.Andre</span></div></div>
        </div>
        </div>
      </div>
      <div class="homeind"></div>
    </div>
  </div>
</div></div>

<div id="panel">
  <div class="presets" id="presets"></div>
  <div class="tabs" id="tabs"></div>
  <div id="levers"></div>
  <div class="leg hidden" id="leg"></div>
</div>
<button class="btn" id="showPanel">⚙︎ панель</button>
<div id="betBox"><textarea id="betTxt" readonly></textarea>
  <div class="bb-r"><button class="btn" id="betCopy">Копіювати</button><span class="sp"></span>
  <button class="btn" id="betClose">Закрити</button></div></div>

<script>
"use strict";
/* ═══ ДАНІ ═══ Прив'язка SR→Area — реальна, надана оператором 11.08.2026. Заглушок немає. */

       '<input class="lv-s" type="range" min="'+e[4]+'" max="'+e[5]+'" step="'+e[6]+'" value="'+v+'" data-sc="'+sc+'" data-k="'+k+'">'+
       '<span class="lv-v">'+(dr?lk+"→"+v:v)+'</span>'+
       '<button class="lv-k'+(lk!==undefined?" lk":"")+'" data-lock="'+sc+"|"+k+'">'+(lk!==undefined?"🔒":"🔓")+'</button></div>';
  }
  levBox.innerHTML=h;
  var live=0,tot=0;
  for(var j=0;j<L.length;j++){tot++;if(LK[lkey(L[j][0],L[j][2])]!==undefined)live++;}
  document.getElementById("lockN").textContent="🔒"+live+"/"+tot;
}
function renderLeg(){
  document.getElementById("leg").innerHTML=
   "<b>ДОШКА</b> = тарель .sh-body з проду (світла --bg / темна --bg-soft + inset). Таця тепер лежить на ньому, "+
   "тому «таця lift» = зливається з дошкою.<br>"+
   "<b>Пресети пишуть у ці самі повзунки</b> — тапнув пресет, далі докручуєш руками.<br>"+
   "<b>🔓/🔒</b> — фіксує значення для поточного зрізу (тема × модель/OFF). Повзунок лишається живим; "+
   "жовте <b>ЛОК→зараз</b> показує зсув від твого локу. 📋 друкує залочене й живе ОКРЕМО.<br>"+
   "<b>Області:</b> реальний розподіл SR по Area (15 представників, 5 областей). Тап по чіпу міняє список: "+
   "Кіровоградська·1 — найкоротший, Київська·7 — зі скролом.<br>"+
   "<b>?</b> — ховає цю панель, щоб важелям лишався весь простір.";
}
function paint(){
  stage.dataset.th=S.th;
  document.getElementById("thBtn").textContent=(S.th==="light")?"☀︎ світла":"🌙 темна";
  applyVars();renderLevers();renderPresets();
}
function applyPreset(tbl,key){
  var src=tbl[key]&&tbl[key][S.th];if(!src)return;
  for(var k in src) V["T/"+S.th][k]=src[k];
  paint();
}
function bet(){
  var out=["AREA-CHIP v2.3 · "+S.th+" · model="+S.model+" · OFF="+S.off+" · dev="+S.dev,""];
  var lockL=[],liveL=[];
  for(var i=0;i<L.length;i++){
    var e=L[i],sc=e[0],k=e[2];
    // Д-3: мертві важелі не друкуються — TM-зріз читається лише для активної моделі
    var v=get(sc,k),lk=LK[lkey(sc,k)];
    var line="  "+k+" = "+v+(lk!==undefined&&lk!==v?"   (ЛОК "+lk+")":"");
    if(lk!==undefined) lockL.push(line); else liveL.push(line);
  }
  out.push("ЗАЛОЧЕНО ("+lockL.length+"):");out=out.concat(lockL.length?lockL:["  —"]);
  out.push("","ЖИВЕ, НЕ ЗАЛОЧЕНО ("+liveL.length+"):");out=out.concat(liveL);
  document.getElementById("betTxt").value=out.join("\n");
  document.getElementById("betBox").classList.add("on");
}

document.addEventListener("input",function(e){
  var t=e.target;if(!t.classList||!t.classList.contains("lv-s"))return;
  set(t.getAttribute("data-sc"),t.getAttribute("data-k"),parseFloat(t.value));
  applyVars();
  var row=t.parentNode,sc=t.getAttribute("data-sc"),k=t.getAttribute("data-k");
  var lk=LK[lkey(sc,k)],v=parseFloat(t.value),dr=(lk!==undefined&&lk!==v);
  row.classList.toggle("drift",dr);
  row.querySelector(".lv-v").textContent=dr?(lk+"→"+v):v;
});
document.addEventListener("click",function(e){
  /* ФІКС: .ac сам є <button> → closest("button") повертав його і клік «з'їдався».
     Чіп перевіряємо ПЕРШИМ, до загальної кнопкової гілки. */
  var chip=e.target.closest(".ac");
  if(chip){S.area=chip.getAttribute("data-a");renderTray();renderList();applyVars();return;}
  var t=e.target.closest("button");
  if(!t)return;
  if(t.hasAttribute("data-lock")){
    var p=t.getAttribute("data-lock").split("|"),key=lkey(p[0],p[1]);
    if(LK[key]!==undefined) delete LK[key]; else LK[key]=get(p[0],p[1]);
    renderLevers();return;
  }
  if(t.hasAttribute("data-tab")){S.tab=t.getAttribute("data-tab");renderTabs();renderLevers();return;}
  if(t.hasAttribute("data-dev")){S.dev=t.getAttribute("data-dev");applyDev();
    var a=document.querySelectorAll("[data-dev]");for(var i=0;i<a.length;i++)if(a[i].tagName==="BUTTON")a[i].classList.toggle("on",a[i].getAttribute("data-dev")===S.dev);return;}
  if(t.hasAttribute("data-m")){S.model=t.getAttribute("data-m");paint();return;}
  if(t.hasAttribute("data-o")){S.off=t.getAttribute("data-o");paint();return;}
  if(t.hasAttribute("data-e")){S.eave=t.getAttribute("data-e");applyPreset(EAVE_P,S.eave);return;}
  if(t.hasAttribute("data-t")){S.trayp=t.getAttribute("data-t");applyPreset(TRAY_P,S.trayp);return;}
  if(t.hasAttribute("data-z")){var z=t.getAttribute("data-z");
    var cur=(S.zoom>0)?S.zoom:parseFloat(zb.textContent)/100;
    if(z==="plus")S.zoom=Math.min(2.4,cur+0.15);
    else if(z==="minus")S.zoom=Math.max(0.35,cur-0.15);
    else S.zoom=0;
    fit();return;}
  if(t.id==="thBtn"){S.th=(S.th==="light")?"dark":"light";paint();return;}
  if(t.id==="legBtn"){var lg=document.getElementById("leg");
    lg.classList.toggle("hidden");t.classList.toggle("on",!lg.classList.contains("hidden"));return;}
  if(t.id==="betBtn"){bet();return;}
  if(t.id==="betClose"){document.getElementById("betBox").classList.remove("on");return;}
  if(t.id==="betCopy"){var ta=document.getElementById("betTxt");ta.select();
    try{document.execCommand("copy");t.textContent="✓ скопійовано";
      setTimeout(function(){t.textContent="Копіювати";},1400);}catch(err){}
    return;}
  if(t.id==="hideBtn"){bb.style.display="none";panel.classList.add("hidden");showPanel.classList.add("on");fit();return;}
  if(t.id==="showPanel"){bb.style.display="";panel.classList.remove("hidden");showPanel.classList.remove("on");fit();return;}
});
(function(){
  var b=document.getElementById("holdBtn");
  var on=function(ev){ev.preventDefault();S.hold=true;b.classList.add("hold");applyVars();renderLevers();};
  var off=function(){if(!S.hold)return;S.hold=false;b.classList.remove("hold");applyVars();renderLevers();};
  b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off);
  b.addEventListener("touchcancel",off);b.addEventListener("mousedown",on);
  b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
})();
window.addEventListener("resize",fit);
seed();applyDev();renderTray();renderList();renderTabs();renderLeg();paint();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AE-Simulator">
<meta name="format-detection" content="telephone=no">
<title>AE-Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6B4A">
<style>
/* ── Палітра і шрифт. Під брендбук АНЦ міняються лише ці значення. ── */
:root{
  --paper:#F1F4F1; --ink:#16211C; --soft:#5E6E66; --line:#C9D2CB;
  --vtm:#0F6B4A; --zf:#A0761B; --loss:#A8402B; --tape:#FBFCFA;

  /* Радіуси — шкалою, не літералами. Три ролі: велика поверхня,
     орган керування, бульбашка розмови. Підкрутити вигляд усього
     застосунку = змінити тут три числа. */
  --r-lg:16px;   /* картки, brief, чек, помилка, жовта панель */
  --r-md:12px;   /* кнопки, поля, textarea, «назад» */
  --r-bub:14px;  /* репліки в розмові */
  --chat:#E7ECE8;   /* фон панелі розмови: темніший за сторінку й за бульбашку */

  /* Прес. Натиск різкий і короткий, повернення довше і з пружиною —
     тому дві різні тривалості, а не одна. */
  --press-in:90ms; --press-out:280ms;
  --press-ease:cubic-bezier(.34,1.5,.64,1);
}
*{box-sizing:border-box}

/* ── АНТИ-ВЕБ-ПАТЕРН ──────────────────────────────────────────────
   Щоб застосунок не видавав себе за веб-сторінку: без виділення
   тексту пальцем, без меню по довгому натисканню, без сірого
   спалаху по тапу, без гумового відскоку сторінки, без зуму
   подвійним тапом. Поля вводу — виняток, там усе це потрібне. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overscroll-behavior:none}
body{
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
input,textarea{
  -webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
/* Текст, який має сенс копіювати руками — розбір і репліки клієнта */
.turn,.brief dd,.tape{-webkit-user-select:text;user-select:text}
body{font-family:"Inter","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100dvh;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px calc(60px + env(safe-area-inset-bottom,0px))}
.num{font-family:"SFMono-Regular","Consolas",monospace;font-variant-numeric:tabular-nums}
.hide{display:none !important}

.lede{max-width:60ch;margin:0 0 6px;font-size:27px;font-weight:620;letter-spacing:-.02em}
.sub{max-width:64ch;color:var(--soft);margin:0 0 22px}

button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Ряд фільтрів — один рядок із горизонтальним скролом, а не три абзаци.
   Від'ємні поля прорізають падінг .wrap, щоб ряд ішов від краю екрана
   до краю: інакше він обривається всередині сторінки і читається як
   помилка верстки. Маска гасить чипи саме на краях. */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -18px 16px;padding:2px 18px 4px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  /* Снапу тут свідомо НЕМАЄ. На iOS scroll-snap вимикає інерцію скролу
     (WebKit 243582): кожен свайп зупиняється на найближчому чипі, і ряд
     з 7 фільтрів доводиться гортати трьома рухами замість одного кидка.
     Снап доречний каруселі, де кадр мусить стати рівно; список фільтрів
     гортають, а не гортають по кадру. */
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;
  font-size:13.5px;padding:6px 13px;border:1px solid var(--line);
  background:#fff;border-radius:20px;cursor:pointer;color:var(--soft);
  transition:transform var(--press-out) var(--press-ease)}
.tabs button:active{transform:scale(.92);transition:transform var(--press-in) ease-out}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#EEF2EF;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;
  text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:7px;
  transition:transform var(--press-out) var(--press-ease)}
/* Картка велика — натиск має бути ледь помітним. Що більший елемент,
   то меншу частку розміру він втрачає під пальцем. */
.card:active{transform:scale(.985);transition:transform var(--press-in) ease-out}
/* hover лише там, де є миша: на iOS він «залипає» після тапу */
@media(hover:hover){.card:hover{border-color:var(--ink)}}
.card:focus-visible{outline:2px solid var(--vtm);outline-offset:2px}
.ord{font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.card h3{margin:0;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--soft);font-size:13.5px}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);
  font-size:13px;display:flex;justify-content:space-between;gap:10px}
.trap{color:var(--loss)}

/* Шапка екрана — завжди дві сходинки: ряд керування, під ним заголовок.
   Раніше кнопка й заголовок стояли в одному рядку з переносом, тому
   довга назва сценарію штовхала верстку і шапка стрибала між одним
   і двома рядками залежно від довжини тексту. Довжина назви не має
   керувати розкладкою. */
.top{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toptitle{margin:0;font-size:20px;font-weight:620;letter-spacing:-.01em;
  max-width:34ch;line-height:1.25}
/* «Назад» — орган керування, а не посилання в тексті: у застосунку
   підкреслений текст читається як веб-сторінка. Шеврон — інлайновий
   SVG, не символ і не емодзі: гліф ← у різних шрифтах різного розміру. */
.back{display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);color:var(--soft);cursor:pointer;
  border-radius:var(--r-md);padding:6px 12px 6px 9px;font-size:13.5px;line-height:1;
  text-decoration:none;transition:transform var(--press-out) var(--press-ease)}
.back:active{transform:scale(.94);transition:transform var(--press-in) ease-out}
.back svg{width:14px;height:14px;flex:0 0 auto;display:block}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:22px;align-items:start}
/* minmax(0,1fr), а не 1fr. У CSS Grid колонка `1fr` має min-width:auto —
   тобто вона роздувається під найширшу дитину і тягне за собою всю
   сторінку. Десктопне правило вище це враховує, мобільне — ні, тому
   будь-яка дитина, ширша за колонку, робила сторінку ширшою за екран:
   з'являвся горизонтальний скрол, і все «прилипало» до правого краю. */
@media(max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}

.brief{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:14px;font-size:13.5px}
.brief dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
.brief dt{color:var(--soft)}
.brief dd{margin:0}

/* Згортання довгих рядків брифінгу («Настрій», «Ціль»).
   ⚠ Згорнуте — це max-height:0, а НЕ display:none. dl тут grid у дві
   колонки, елементи лягають потоком: зникла dd звільняє другу колонку,
   і наступний dt заїжджає в неї — розкладка розсипається. Нульова
   висота лишає dd у сітці, колонка зайнята. */
.brief dt.fold{display:flex;align-items:center;gap:5px;cursor:pointer;
  padding:6px 0;margin:-6px 0;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.brief dt.fold .chev{flex:0 0 auto;transition:transform 240ms cubic-bezier(.32,.72,0,1)}
.brief dt.fold[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.brief dd.fold-b{max-height:340px;overflow:hidden;
  transition:max-height 240ms cubic-bezier(.32,.72,0,1),opacity 150ms linear}
.brief dd.fold-b[data-open="0"]{max-height:0;opacity:0}
@media(prefers-reduced-motion:reduce){
  .brief dt.fold .chev,.brief dd.fold-b{transition:none}
}

/* ── ПАНЕЛЬ РОЗМОВИ ───────────────────────────────────────────────
   Репліки й поле вводу жили просто на сторінці, тому екран читався як
   «текст, поле і кнопка», а не як переписка. Тепер вони в одній
   заглибленій панелі: фон трохи темніший за сторінку, поле вводу —
   білою смугою, притиснутою до низу панелі. Це та сама форма, яку
   людина щодня бачить у месенджері, і впізнає без пояснень.
   Фон панелі мусить бути ТЕМНІШИЙ за білу бульбашку клієнта — інакше
   репліки зникають у ньому. */
.chat{background:var(--chat);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:14px;overflow:hidden}
/* Від'ємних полів усередині панелі немає свідомо: смуга вводу притиснута
   до країв не витягуванням себе за батька, а тим, що падінг живе на
   внутрішньому блоці. Дитина, ширша за батька, — це те, що ламало сітку. */
.chat-body{padding:12px 12px 0}
.chat-h{display:flex;align-items:center;gap:8px;padding:2px 3px 10px;
  font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.chat-h::after{content:'';flex:1;height:1px;background:var(--line)}
.chat-hint{font-size:12.5px;color:var(--soft);text-align:center;padding:2px 12px 4px}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:88px}

/* Крапки «клієнт друкує». Раніше очікування показувала тільки кнопка,
   яка ставала «…» — тобто відповідь готувалась не там, де вона зʼявиться. */
.dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--soft);
  animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
.turn{max-width:82%;padding:10px 14px;border-radius:var(--r-bub);white-space:pre-wrap;
  overflow-wrap:anywhere}
.client{background:#fff;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--ink);color:#EEF2EF;align-self:flex-end}
/* РОЗБІР писав наставник, а не клієнт — але виглядав він як репліка
   клієнта, у такій самій білій бульбашці. Читалось так, ніби це клієнт
   раптом заговорив про «принцип лаконічності». Даємо йому власну форму:
   на всю ширину, без хвоста бульбашки, з зеленою межею збоку. */
.review{align-self:stretch;max-width:100%;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--vtm);
  border-radius:var(--r-bub)}
.review .who{color:var(--vtm)}
.phrase{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:13.5px}
.phrase b{color:var(--soft);font-weight:600}
.sys{align-self:center;color:var(--soft);font-size:13px;font-style:italic;text-align:center;max-width:90%}
.who{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--soft);margin-bottom:3px}
.me .who{color:#93A79B}

.say{display:flex;gap:8px;align-items:flex-end;
  padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.say textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);
  resize:vertical;min-height:62px;background:#fff;color:inherit}
.btn{padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#EEF2EF;
  border-radius:var(--r-md);cursor:pointer;
  transition:transform var(--press-out) var(--press-ease)}
.btn:active{transform:scale(.96);transition:transform var(--press-in) ease-out}
.btn[disabled]:active{transform:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink)}

.tape{background:var(--tape);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
  position:sticky;top:16px;font-size:13.5px}
.tape h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.tapeline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tapeline.total{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
.big{font-size:19px}
.bignum{font-size:32px;font-weight:640;letter-spacing:-.02em}
.tag{font-size:10.5px;padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.t-vtm{background:var(--vtm);color:#fff}
.t-zf{background:var(--zf);color:#fff}
.t-none{background:var(--line);color:var(--ink)}

/* ── Редактор даних (крок Р-1а) ───────────────────────────────────
   Картка САМА не клікається й після Р-1б: усередині неї живе <details>
   із рядками правил, і натиск по всій площі зʼїдав би акордеон — тобто
   одна зона відповідала б на два різні наміри. Вхід у поля — окремою
   кнопкою в підвалі картки. Тому cursor і натиск .card перебиваються. */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.ecard{cursor:default}
.ecard:active{transform:none}
/* Стан картки — той самий словник кольорів, що й у панелі перевірки
   (✓ зелений · ⚠ приглушений · ✗ втрата). Другої палітри для того
   самого вердикту не заводимо: два кольори одного ✗ читались би як
   два різні ✗. */
.est{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.emood{margin:0;color:var(--soft);font-size:13px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eline{margin:0;font-size:13.5px;line-height:1.45}
/* Смуга публікації має ВЛАСНИЙ клас, хоч виглядає так само, як рядок
   вердикту. .eline — це рядок, сказаний правилами; гейт рахує їх і звіряє
   суму з вердиктом. Смуга стану, одягнена в той самий клас, додалась би
   до цієї суми й почервонила б твердження про зовсім інший предмет. */
.publine{margin:0;font-size:13.5px;line-height:1.45}
.pubbar{margin:0 0 4px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
/* 16px на полях — не смак: Safari на iOS підʼїжджає зумом до будь-якого
   поля, дрібнішого за 16, і повернути масштаб назад користувач мусить
   руками. Тому те саме число стоїть на input, textarea і select. */
.field input,.field textarea,.field select{width:100%;max-width:420px;font:inherit;font-size:16px;
  padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;color:inherit}
.field textarea{resize:vertical;min-height:64px;line-height:1.4}
/* Рідний вигляд select на iOS — сірий прямокутник системного кольору;
   appearance:none знімає його, шеврон домальовується фоном. */
.field select{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
    linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field .flab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;max-width:420px}
.field .flab b{font-weight:600;color:var(--ink)}

/* Підказка правила — під полем, а не в спливному вікні: на телефоні
   вікно ховає рівно те поле, заради якого його відкрили. */
.ehint{max-width:420px;margin:6px 0 0;padding:0 0 0 16px;font-size:12.5px;
  line-height:1.5;color:var(--soft)}
.ehint li{margin:0 0 1px}
.ecount{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--soft)}
.ecount.over{color:var(--loss)}
/* Рядки, які правити не можна, і причина цього — поруч, а не мовчки. */
.ero{max-width:420px;margin:0 0 14px}
.ero .tapeline span:last-child{color:var(--ink);text-align:right;word-break:break-word}
.enote{max-width:520px;margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--soft)}
.everd{max-width:520px;margin:0 0 14px}
.echip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--soft);white-space:nowrap}

/* ── ВИБІРНИК КОДІВ (Р-1г-1) ───────────────────────────────────────
   Обране показується НАЗВАМИ: у файлі живе код, у голові людини —
   назва товару. Код лишається поруч дрібним, бо саме ним говорять
   правила, і людина мусить упізнати рядок вироку. */
.pick{max-width:420px}
.picksel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
/* Назва обраного НЕ обрізається. «Стрепсілс інтенсив 8,75 мг №16» —
   дозування й кількість стоять у хвості рядка, і обрізана назва в
   аптечному каталозі це інший товар. Тому white-space тут скинутий,
   хоч .echip його й тримає. */
.picksel .echip{white-space:normal;text-align:left}
.pickno{font-size:12.5px;color:var(--soft)}
/* Пул під cats буває до 52 позицій. Без власної прокрутки три вибірники
   розтягли б картку на кілька екранів, і вирок правил унизу перестав би
   бути видимим разом із вибором. */
.picklist{max-height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:0 0 4px;border-top:1px dashed var(--line)}
.pickitem{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;
  border-bottom:1px dashed var(--line);cursor:pointer}

   «Нічого не знайдено» порожнє місце до мінімуму — назване, не дефект. Коли чек + мінімум
   пропозицій не вміщаються, колонка скролиться як запасний вихід — сховане = відсутнє, тож нічого не обрізаємо.
   ≤980 не чіпаємо (§11.8). Третій блок — .mock (?mock, П27): сітка на два ряди тут не годилась.

<!-- Правила цілісності даних. Єдине тіло на командний рядок, цю сторінку і
     (крок «в») воркер: розходження копій — те, від чого проєкт тікає з S7 §3.
     ⚠ jsdom зовнішні скрипти за атрибутом src НЕ вантажить. tools/smoke_ui_v1.js
     підставляє вміст цього файлу замість тега перед парсингом — знімеш тег,
     підстановка не спрацює і AE_RULES стане undefined, смоук почервоніє.
     ⚠ У коментарях тут НЕ писати відкривальний тег скрипта літерами: текстові
     інструменти (Lens_validate --html) ловлять його як справжній і витягують
     сміття замість коду. -->
<script id="AE-PREVIEW-RULES">
/* AE-Simulator · ПРАВИЛА цілісності даних — єдине тіло на всіх споживачів
   живе доки: catalog.json + scenarios.json лишаються джерелом даних тренажера

   Тут немає fs, console, process і нічого з Node: файл мусить читатись
   однаково з командного рядка, з браузера і (крок «в») з воркера. Друк,
   шляхи і код виходу живуть в обгортці tools/ae_validate.js.

   ⚠ ЄДИНА КОПІЯ. Правило, вписане повз цей файл, розходиться з рештою
   мовчки: гейт на push, браузерна перевірка і редактор почнуть казати
   різне про той самий файл. Сторож на це стоїть у tools/smoke_step3.js.

   validate(catalogRaw, scenariosRaw, charactersRaw, configRaw)
     → {out:[{lvl:'ok'|'warn'|'err', msg}], ok, warn, err}
   Два останні — НОСІЇ закритих переліків (характери · щаблі). Копій цих
   переліків тут немає і бути не може (12.11-а): носій приходить аргументом,
   не прийшов — перевірка каже про це ⚠ вголос.

   ⚠ Повідомлення складаються в ОДИН масив у порядку виникнення, а не в три
   за рівнем. Оригінал друкував їх у момент спрацювання, і ✓/⚠/✗ у виводі
   перемішані за ходом коду; три масиви дали б ті самі числа при іншому
   тексті — тобто зелений гейт на зміненому виводі (1.15, пастка 4). */

/* ── МЕЖА І ОЗНАКИ РЯДКА mood ─────────────────────────────────────────
   Число і формулювання винесені з тіла validate() НАВМИСНО: їх читає ще
   один споживач — підказка біля поля в редакторі (S23, Р-2). Копія «90»
   або копія переліку в index.html була б другим домом (12.11) і розійшлась
   би рівно тоді, коли зʼявиться девʼята ознака.
   ⚠ Формулювання — рівно про ті перевірки, що нижче, у тому ж порядку.
   Назв характерів і щаблів тут немає й бути не може: smoke_rules_v1 грепає
   тіло цього файлу на них, і приклад у тексті почервонив би його справедливо. */
const MOOD_LIMIT = 90;
const MOOD_SIGNS = [
  'не довше за ' + MOOD_LIMIT + ' символів',
  'без прямої мови в лапках — вона живе в open',
  'без цифр',
  'без слів, яких клієнт не знає: ₴, орієнтир, приріст',
  'не повторює слів з open, who і mode',
  'не називає характер — його дім у носії характерів',
  'не називає щабель — він читається з рядка, а не оголошується в ньому',
  'не повторює інший рядок mood — ні дослівно, ні двома спільними словами',
];

/* ── ОБЛАСТІ ПРАВИЛ ───────────────────────────────────────────────────
   Порядок і людські підписи для екрана A7. Дім переліку — тут, поруч із
   секціями, які його ставлять; UI бере AE_RULES.AREAS і власної копії не
   тримає (12.11). Ключ рядка — поле area, не grp: grp — поле сценарію. */
const AREAS = [
  ['catalog',    'Каталог товарів'],
  ['scenarios',  'Сценарії'],
  ['characters', 'Характери й настрій клієнтів'],
  ['potential',  'Що можна допродати'],
  ['shift',      'Чи збирається зміна'],
];

function validate(catalogRaw, scenariosRaw, charactersRaw, configRaw){
  /* Нормалізація форми файлу — це ПРАВИЛО, не читання: обидві форми
     («{categories:{…}}» і голий обʼєкт, «{scenarios:[…]}» і голий масив)
     приходять однаково і з диска, і з поля вибору файлу в браузері. */
  const CAT = catalogRaw && catalogRaw.categories
    ? Object.fromEntries(Object.entries(catalogRaw.categories).map(([k,v])=>[k,v.items]))
    : catalogRaw;
  const SCEN = (scenariosRaw && scenariosRaw.scenarios) || scenariosRaw;

  const out=[]; let ok=0,warn=0,err=0;
  let AREA=null;   // ставить кожна секція нижче; рядок без області = дефект
  /* X92 · say — людське речення поруч із технічним msg. Беремо лише рядок:
     forEach(E) передав би індекс, і say став би числом (S72, мікроскоп C2). */
  const SAY=t=>typeof t==='string'?t:null;
  /* Українська множина для say: 1 товар · 2–4 товари · 5+ товарів (11–14 — «товарів»). */
  const PL=(n,one,few,many)=>{const d=n%10,h=n%100; return n+' '+(d===1&&h!==11?one:d>=2&&d<=4&&(h<12||h>14)?few:many)};
  const E=(m,t)=>{out.push({lvl:'err', msg:m, say:SAY(t), area:AREA}); err++};
  const W=(m,t,n)=>{out.push({lvl:'warn',msg:m, say:SAY(t), norm:n===true, area:AREA}); warn++};
  const O=(m,t)=>{out.push({lvl:'ok',  msg:m, say:SAY(t), area:AREA}); ok++};

  AREA='catalog';
  // --- індекс товарів
  const ALL={},dupC=[];
  for(const [cat,arr] of Object.entries(CAT))
    for(const it of arr){ if(ALL[it.c])dupC.push(it.c); ALL[it.c]={...it,cat}; }
  dupC.length?E('дублі кодів товару: '+dupC.join(', '),'Кілька товарів мають однаковий код: '+dupC.join(', ')):O('коди товарів унікальні ('+Object.keys(ALL).length+')','Кожен товар має власний код, плутанини не буде ('+PL(Object.keys(ALL).length,'товар','товари','товарів')+')');

  // --- поля товару
  const badItem=[];
  for(const [c,it] of Object.entries(ALL)){
    if(typeof it.n!=='string'||!it.n.trim())badItem.push([c+' — немає назви','Товар '+c+' без назви']);
    if(typeof it.b!=='number'||!(it.b>=0))badItem.push([c+' — бонус не число','У товару '+c+' бонус записано не числом']);
    if(!['ВТМ','ЗФ','—',undefined,null].includes(it.k)&&typeof it.k!=='string')badItem.push([c+' — мітка k','У товару '+c+' неправильна мітка марки']);
  }
  badItem.length?badItem.forEach(([m,t])=>E(m,t)):O('поля товарів цілі (n, b, k)','У кожного товару є назва, бонус і мітка марки');
  const noPrice=Object.values(ALL).filter(i=>i.p===null).length;
  noPrice&&W('товарів без ціни (p:null): '+noPrice+' — норма, позиція нова',PL(noPrice,'товар','товари','товарів')+' ще без ціни. Так буває з новими позиціями, виправляти не треба',true);

  AREA='scenarios';
  // --- сценарії
  const ids=SCEN.map(s=>s.id), dupId=ids.filter((x,i)=>ids.indexOf(x)!==i);
  dupId.length?E('дублі id сценаріїв: '+[...new Set(dupId)].join(', '),'Кілька сценаріїв мають однаковий номер: '+[...new Set(dupId)].join(', ')):O('id сценаріїв унікальні ('+SCEN.length+')','Усі сценарії різні ('+PL(SCEN.length,'сценарій','сценарії','сценаріїв')+')');

  const nums=SCEN.filter(s=>s.no).map(s=>s.no);
  const dupNo=nums.filter((x,i)=>nums.indexOf(x)!==i);
  dupNo.length?W('однакові номери замовлень: '+[...new Set(dupNo)].join(', '),'Номери замовлень повторюються: '+[...new Set(dupNo)].join(', ')):O('номери замовлень унікальні ('+nums.length+' інтернет-замовлень)','Номери '+nums.length+' інтернет-замовлень не повторюються');

  const REQ=['id','grp','title','cats','main','order','open','who','character','mood','mode'];
  /* X92 · людські назви полів — для say. Дім — тут, поруч із REQ. */
  const FSAY={id:'номер',grp:'група',title:'назва',cats:'категорії',main:'головний товар',order:'замовлення',
    open:'перша репліка',who:'хто клієнт',character:'характер',mood:'настрій',mode:'обставини',bv:'ідеал ВТМ',bm:'ідеал СТМ'};
  let hang=0,badf=0,badcat=0,badmain=0;
  for(const s of SCEN){
    const tag='#'+s.id+' «'+(s.title||'?')+'»';
    for(const f of REQ) if(s[f]===undefined||s[f]===null||s[f]===''){E(tag+' — немає поля '+f,'Сценарій '+tag+': не заповнено «'+FSAY[f]+'»');badf++}
    for(const k of (s.cats||[])) if(!CAT[k]){E(tag+' — категорія «'+k+'» не існує','Сценарій '+tag+': категорії «'+k+'» немає в каталозі');badcat++}
    if(s.main&&!(s.cats||[]).includes(s.main)){E(tag+' — main «'+s.main+'» не у cats','Сценарій '+tag+': головний товар не з категорій сценарію');badmain++}
    for(const fld of ['order','bv','bm'])
      for(const c of (s[fld]||[])) if(!ALL[c]){E(tag+' — '+fld+': код «'+c+'» не існує в каталозі','Сценарій '+tag+': товару з кодом «'+c+'» немає в каталозі');hang++}
    // ідеальна розмова має бути в межах доступного асортименту
    const pool=new Set((s.cats||[]).flatMap(k=>(CAT[k]||[]).map(i=>i.c)));
    for(const fld of ['order','bv','bm'])
      for(const c of (s[fld]||[])) if(ALL[c]&&!pool.has(c))
        W('#'+s.id+' — '+fld+': «'+c+'» поза cats сценарію (модель його не побачить)','Сценарій #'+s.id+': товар «'+c+'» не з категорій сценарію — модель його не побачить');
    if(!s.noSale){
      if(!s.bv||!s.bv.length)W(tag+' — немає bv (ідеал під правило ВТМ)','Сценарій '+tag+': немає ідеального набору під правило ВТМ');
      if(!s.bm||!s.bm.length)W(tag+' — немає bm (ідеал під правило СТМ)','Сценарій '+tag+': немає ідеального набору під правило СТМ');
    }
  }
  !badf&&O('обовʼязкові поля на місці ('+REQ.join(', ')+')','У кожному сценарії заповнено все потрібне');
  !badcat&&O('усі cats існують у каталозі','Усі категорії зі сценаріїв є в каталозі');
  !badmain&&O('main завжди входить у cats','Головний товар належить до категорій свого сценарію');
  !hang&&O('висячих кодів немає (order · bv · bm)','Кожен товар із замовлень є в каталозі');

  AREA='characters';   // і розділ mood нижче
  // --- характер: значення мусить мати запис у носії
  /* Списку девʼяти тут НЕМАЄ навмисно. Єдиний його дім — prompts/characters.md;
     копія в коді розійшлася б із носієм рівно тоді, коли Оля додасть характер.
     Носій приходить аргументом. Не прийшов — кажемо це вголос: мовчазний
     пропуск виглядав би як пройдена перевірка (12.12-г). */
  /* Перелік назв піднятий сюди: його читає і розділ mood нижче. Другого
     розбору носія не робимо — два парсери того самого файлу розійшлись би. */
  let charNames=null;
  if(typeof charactersRaw === 'string' && charactersRaw.trim()){
    const recs = [...('\n'+charactersRaw.replace(/<!--[\s\S]*?-->/g,'')).matchAll(/\n## (.+?)\n([\s\S]*?)(?=\n## |$)/g)];
    const hasClient = m=>/### для клієнта\s*\S/.test(m[2]);
    const hasRisk   = m=>/### ризик\s*\S/.test(m[2]);
    const known = new Set(recs.filter(hasClient).map(m=>m[1].trim()));
    charNames = [...known];
    known.size ? O('характерів у носії: '+known.size,'Описано характерів клієнтів: '+known.size) : E('носій характерів прочитано, але жодного запису з блоком «для клієнта»','Файл характерів прочитано, але жодного опису для клієнта в ньому немає');
    const orphan=SCEN.filter(s=>s.character && !known.has(s.character));
    orphan.length
      ? orphan.forEach(s=>E('#'+s.id+' — характеру «'+s.character+'» немає в носії','Сценарій #'+s.id+': характеру «'+s.character+'» немає серед описаних'))
      : O('усі character мають запис у носії','Кожен клієнт у сценаріях має опис характеру');
    const idle=[...known].filter(k=>!SCEN.some(s=>s.character===k));
    idle.length && W('характери без жодного сценарію: '+idle.join(', '),'Характери, які не використано в жодному сценарії: '+idle.join(', '));
    /* Другий блок запису. «### для клієнта» їде в промпт клієнта,
       «### ризик» — у промпт судді. Запис без другого блоку проходить
       усі перевірки вище і дає судді порожній приціл: дефект того самого
       класу, що характер без опису, тільки з іншого боку носія. */
    const noRisk = recs.filter(m=>hasClient(m) && !hasRisk(m)).map(m=>m[1].trim());
    noRisk.length
      ? noRisk.forEach(n=>E('запис «'+n+'» не має блоку «### ризик» — промпт судді лишиться без прицілу','У характеру «'+n+'» немає підказки для судді'))
      : O('усі записи носія мають обидва блоки','У кожного характеру є опис і для клієнта, і для судді');
  } else {
    W('носій характерів не переданий — значення character не звірені','Файл характерів не завантажився — характери сценаріїв не перевірено');
  }

  /* --- рядок mood: обставини цього дня, а не характер і не щабель
     Правило повним текстом — AE_Simulator_MOOD_RULE_v1.md §1; людський дім
     для Олі — ДЛЯ_ОЛІ/ПОЧНИ_ЗВІДСИ.md (крок Док-Олі, ще не написаний).

     ⚠ МЕЖА ЦІЄЇ ПЕРЕВІРКИ, названа вголос (12.12-и). Правило сформульоване
     словами («рядок не називає характер»), а перевірка тут ЛЕКСИЧНА: вона
     шукає слова. Рядок, що описує характер інакшими словами — «постійний
     клієнт, звик до свого списку, змін не любить» — проходить зеленим,
     не вживши жодного забороненого кореня. На заміряному прогоні старих
     43 рядків детектор почервонив 19 із них; решту ловить людина по
     таблиці розкладки (MOOD_RULE_v1 §4), не ця функція.
     Зелений тут означає «жодної ознаки не знайдено», а не «правило
     виконане». */
  /* MOOD_LIMIT живе вгорі файлу — його читає ще й підказка в редакторі. */
  /* Корінь назви = слово без двох останніх літер: рід і відмінок у
     прикметнику сидять саме там, а носій тримає одну форму на всі.
     ⚠ Прикладів із назвами характерів і щаблів у цих коментарях НЕМАЄ
     навмисно: смоук грепає тіло файлу на них, і приклад у коментарі
     почервонив би перевірку 12.11-а справедливо — літери в файлі є.
     Нижня межа пʼять літер — нижче корінь починає
     траплятись усередині чужих слів («рах» сидить у «страх»), тому слова
     назв, коротші за пʼять літер, у перевірку не входять узагалі.
     Це друга названа дірка, а не недогляд. */
  const rootsOf = phrase => (String(phrase).toLowerCase().match(/[а-яїієґёa-zʼ']+/g)||[])
    .filter(w=>w.length>=5).map(w=>w.slice(0, Math.max(5, w.length-2)));
  const mWords = t => new Set((String(t).toLowerCase().match(/[а-яїієґёa-zʼ']{5,}/g)||[]));
  const moodOf = s => typeof s.mood==='string' ? s.mood : '';
  let moodBad=0;
  const ME=(m,t)=>{E(m,t);moodBad++};

  for(const s of SCEN){
    const m=moodOf(s), tag='#'+s.id+' mood', hs='Сценарій #'+s.id+': опис настрою ';
    if(!m) continue;                       // порожнє поле вже спіймав REQ
    if(m.length>MOOD_LIMIT) ME(tag+' — довжина '+m.length+' > '+MOOD_LIMIT,hs+'задовгий ('+m.length+' символів, можна '+MOOD_LIMIT+')');
    if(/[«»"„“]/.test(m))   ME(tag+' — пряма мова в лапках (дім — open)',hs+'містить пряму мову в лапках — їй місце в першій репліці');
    if(/\d/.test(m))        ME(tag+' — цифра в рядку',hs+'містить цифру');
    if(/₴|орієнтир|приріст/i.test(m)) ME(tag+' — межа знань: цього слова клієнт не знає',hs+'містить слово, якого клієнт не знає');
    for(const fld of ['open','who','mode']){
      const wb=mWords(s[fld]||'');
      const inter=[...mWords(m)].filter(w=>wb.has(w)).sort();
      if(inter.length) ME(tag+' — повторює '+fld+': '+inter.join(', '),hs+'повторює слова з поля «'+FSAY[fld]+'»: '+inter.join(', '));
    }
  }

  if(charNames && charNames.length){
    for(const s of SCEN){
      const m=moodOf(s).toLowerCase(); if(!m) continue;
      for(const n of charNames){
        const nl=n.toLowerCase();
        if(m.includes(nl)){ ME('#'+s.id+' mood — назва характеру «'+n+'» (дім — prompts/characters.md)','Сценарій #'+s.id+': опис настрою називає характер «'+n+'»'); continue; }
        const hit=rootsOf(n).find(r=>m.includes(r));
        if(hit) ME('#'+s.id+' mood — корінь назви характеру «'+hit+'» («'+n+'»)','Сценарій #'+s.id+': опис настрою натякає на назву характеру «'+n+'»');
      }
    }
    O('mood звірений з переліком характерів ('+charNames.length+')','Настрій ніде не видає назву характеру');
  } else {
    W('носія характерів немає — mood не звірений з назвами характерів','Файл характерів не завантажився — настрій не звірено з назвами характерів');
  }

  /* Перелік щаблів має рівно один машинний дім — config.json, схема відповіді
     клієнта. Тут його копії немає з тієї самої причини, що й копії характерів. */
  const cs=configRaw&&configRaw.schemas&&configRaw.schemas.turn&&configRaw.schemas.turn.schema;
  const STEPS = cs&&cs.properties&&cs.properties.step&&cs.properties.step.enum;
  if(STEPS && STEPS.length){
    for(const s of SCEN){
      const m=moodOf(s).toLowerCase(); if(!m) continue;
      for(const st of STEPS){
        const hit=[st.toLowerCase(), ...rootsOf(st)].find(r=>m.includes(r));
        if(hit){ ME('#'+s.id+' mood — назва щабля «'+st+'»: стартовий щабель виводиться з рядка, а не називається в ньому','Сценарій #'+s.id+': опис настрою підказує етап, з якого почнеться розмова'); break; }
      }
    }
    O('mood звірений з переліком щаблів ('+STEPS.length+')','Настрій не підказує, з якого етапу почнеться розмова');
  } else {
    W('config не переданий — mood не звірений з назвами щаблів','Налаштування не завантажились — настрій не звірено з етапами розмови');
  }

  const moodSeen={};
  for(const s of SCEN){
    const k=moodOf(s).toLowerCase().trim(); if(!k) continue;
    if(moodSeen[k]!==undefined) ME('#'+s.id+' mood — дослівний дубль #'+moodSeen[k],'Сценарій #'+s.id+': опис настрою дослівно як у сценарії #'+moodSeen[k]);
    else moodSeen[k]=s.id;
  }
  for(let a=0;a<SCEN.length;a++) for(let b=a+1;b<SCEN.length;b++){
    const wb=mWords(moodOf(SCEN[b]));
    const inter=[...mWords(moodOf(SCEN[a]))].filter(w=>wb.has(w)).sort();
    if(inter.length>=2) ME('#'+SCEN[a].id+' ~ #'+SCEN[b].id+' mood — спільних слів '+inter.length+': '+inter.join(', '),'Сценарії #'+SCEN[a].id+' і #'+SCEN[b].id+': описи настрою надто схожі ('+inter.join(', ')+')');
  }
  !moodBad && O('рядки mood за правилом (≤'+MOOD_LIMIT+' символів · без лапок, цифр і межі знань · без назв характеру і щабля · без повтору open/who/mode · без дублів)','Описи настрою короткі, без цифр і цитат, не повторюють одне одного');

  AREA='potential';
  // --- потенціал > 0
  const bonus=cs=>cs.reduce((a,c)=>a+(ALL[c]?ALL[c].b:0),0);
  let zero=[];
  for(const s of SCEN){
    if(s.noSale)continue;
    for(const [r,f] of [['ВТМ','bv'],['СТМ','bm']]){
      if(!s[f]||!s[f].length)continue;
      const p=bonus(s[f])-bonus(s.order||[]);
      if(p<=0)zero.push(['#'+s.id+' '+r+': приріст '+p.toFixed(2)+' ₴','Сценарій #'+s.id+': за правилом '+r+' ідеальний набір не дорожчий за замовлення']);
    }
  }
  zero.length?zero.forEach(([m,t])=>W(m,t)):O('ідеал завжди дорожчий за замовлення (приріст > 0)','У кожному сценарії є що запропонувати понад замовлення');

  AREA='shift';
  // --- склад зміни: pickShift потребує пулів
  const NET=SCEN.filter(s=>s.no);
  const pools={'пастка/noSale':NET.filter(s=>s.trap||s.noSale),'багатопозиційні':NET.filter(s=>(s.order||[]).length>1),'рецептурні':NET.filter(s=>s.grp==='Рецептурні')};
  const PSAY={'пастка/noSale':'-пасток','багатопозиційні':' на кілька товарів','рецептурні':' за рецептом'};
  for(const [k,v] of Object.entries(pools)) v.length?O('пул «'+k+'»: '+v.length,'Для зміни вистачає замовлень'+PSAY[k]+' ('+v.length+')'):E('пул «'+k+'» порожній — зміна не збереться','Немає жодного замовлення'+(k==='пастка/noSale'?'-пастки':PSAY[k])+' — зміна не збереться');
  NET.length>=5?O('інтернет-замовлень для зміни: '+NET.length+' (треба ≥5)','Замовлень достатньо: '+NET.length+', а треба 5'):E('інтернет-замовлень '+NET.length+', зміна потребує 5','Інтернет-замовлень лише '+NET.length+', а для зміни треба 5');

  return {out, ok, warn, err};
}

/* Два виходи, бо споживачі різні: Node бере require, браузер — тег <script>.
   ⚠ Воркер (крок «в») хоче ESM-import і цим хвостом НЕ закривається. */
if (typeof module !== 'undefined' && module.exports) module.exports = { validate, MOOD_LIMIT, MOOD_SIGNS, AREAS };
if (typeof globalThis !== 'undefined') globalThis.AE_RULES = { validate, MOOD_LIMIT, MOOD_SIGNS, AREAS };

</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   AE-Simulator · крок 1: скелет без AI
   живе доки: рушій розмови не підключено до Groq (крок 2)

   Двигун розмови — ЗАМІННА ДЕТАЛЬ. Уся гра ходить через engine.turn().
   На кроці 2 сюди стане Groq, і більше нічого міняти не треба.
   ═══════════════════════════════════════════════════════════════════ */

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,attrs={},kids=[])=>{
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class')n.className=v;
    else if(k==='html')n.innerHTML=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==false)n.setAttribute(k,v);
  }
  for(const c of [].concat(kids)) if(c) n.append(c);
  return n;
};

/* ⚠ Мишачий вказівник, не «не-мобільний». Ширина екрана тут ні до чого:
   iPad із клавіатурою широкий, але пальцем; вузьке вікно на ноутбуці
   вузьке, але мишею. Питаємо рівно те, що потрібно — чи є наведення й
   точний вказівник. Читається ОДИН раз при завантаженні: перечитувати
   нема заради чого, а живий запит у кожному натисканні клавіші — це
   робота в найгарячішому місці.
   matchMedia у частині середовищ (jsdom) — заглушка, що завжди каже «ні»;
   try тут не заради jsdom, а тому що відсутній matchMedia не має права
   вбити ввід репліки. */
const POINTER_FINE = (()=>{ try{
  return matchMedia('(hover:hover) and (pointer:fine)').matches;
}catch(_){ return false; } })();

/* Нативний root.append(null) НЕ пропускає порожнє повз себе — він робить
   з null текстовий вузол «null», і той друкується на екрані. Саме так
   на списку замовлень зʼявлялось слово «null» над кнопкою «Почати зміну».
   el() своїх дітей фільтрує, тому екрани збираємо тільки через put(). */
const put = (root,...kids)=>{ for(const c of kids) if(c) root.append(c); };

/* Шеврон «назад». Інлайновий SVG, а не символ ← : гліф у різних шрифтах
   різного розміру й ваги, а тут він мусить збігатися з текстом поруч. */
const CHEVRON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
  + '<path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.7" '
  + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';
const backBtn = (label,onclick)=>el('button',{class:'back',onclick,
  'aria-label':label, html:CHEVRON+'<span>'+label+'</span>'});

/* Шеврон згортання — окремий, дивиться вниз, повертається вбік.
   Малюється в SVG-просторі імен: createElement('svg') віддає HTML-елемент
   із таким іменем, а не графіку, і нічого не намалює. */
const foldChev = ()=>{
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('class','chev'); s.setAttribute('width','11');
  s.setAttribute('height','11'); s.setAttribute('viewBox','0 0 12 12');
  s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d','M2.5 4.5 6 8l3.5-3.5');
  p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.6');
  p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  s.append(p); return s;
};

/* Робить названі рядки брифінгу згортаними.
   ⚠ Це ПОСТ-ПРОХІД по вже зібраному dl, а не переписані рядки складання.
   Рядок складання пари dt/dd для «Настрою» дослівно збігається з третьою
   ін'єкцією smoke_ui_v1 (цитувати його тут НЕ можна: String.replace бере
   перше входження, і ін'єкція вирізала б коментар): переписати його — зняти
   сторожа, поставленого проти повторної втрати mood (S7 §2.2). Тому текст
   рядків недоторканий, поведінка домальовується зверху.
   dt лишається носієм тексту мітки: шеврон — SVG без текстового вмісту,
   тож dt.textContent і далі рівний «Настрій», а dd не отримує ані символу
   зайвого тексту — обидва твердження смоуку читають те саме, що читали. */
function foldRows(dl, labels){
  const kids=[...dl.children];
  for(let i=0;i<kids.length-1;i++){
    const dt=kids[i], dd=kids[i+1];
    if(dt.tagName!=='DT' || dd.tagName!=='DD') continue;
    const key=dt.textContent.trim();
    if(!labels.includes(key)) continue;
    dt.classList.add('fold'); dd.classList.add('fold-b');
    dt.append(foldChev());
    dt.setAttribute('role','button'); dt.setAttribute('tabindex','0');
    if(S.fold[key]===undefined) S.fold[key]=true;   // за замовчуванням відкрито
    const set=open=>{ S.fold[key]=open;
      dt.setAttribute('aria-expanded',String(open));
      dd.setAttribute('data-open',open?'1':'0'); };
    set(S.fold[key]);
    dt.addEventListener('click',()=>set(!S.fold[key]));
    dt.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); set(!S.fold[key]); }});
  }
}

/* ── v2 · ПК-оболонка (Х21 крок 2) ─────────────────────────────────

/* --- X71 - ДІМ КУРАТОРА (X71-DIM-KURATORA) --------------------------------

        if(x===null) return 1; if(y===null) return -1; return (x - y) * dir; }

  const sc = S.sc, st = e2State(), hist = S.history, pot = potential(sc);
  /* Х24.4: розмова, відкрита з промаху в підсумку зміни. Підсумок заморожений —
     ця спроба не пишеться в shift.rows і не рухає shift.i; вихід веде назад на E3. */
  const fromE3 = S.e2from === 'e3';
  const mine = () => S.screen === 'game' && S.history === hist;
  /* Повний render() — лише на зміну розмови. Фокус живе в полі з data-e2-focus і повертається туди ж. */
  const again = () => { if(!mine()) return;
    const a = document.activeElement; if(!st.focus && a && a.dataset && a.dataset.e2Focus) st.focus = a.dataset.e2Focus;
    render(); };
  const say = async () => {
    const line = st.draft.trim(); if(!line || S.ended || S.waiting) return;
    hist.push({role:'user', content:line, t:e2Now()});
    st.draft = ''; st.err = ''; st.focus = 'answer'; S.waiting = true; again();
    try{
      const r = await engine.turn(sc, hist);
      if(S.history !== hist) return;
      hist.push({role:'assistant', content:r.reply, step:r.step || '', t:e2Now()});
      S.cart = r.cart; S.ended = r.ended; S.feedback = r.feedback || ''; S.phrase = '';
      S.waiting = false; again();
      if(S.ended && typeof engine.judge === 'function'){
        S.judging = true; again();
        try{
          const j = await engine.judge(sc, hist, S.cart);
          if(S.history === hist){ S.feedback = j.feedback || S.feedback; S.phrase = j.phrase || ''; }
        }catch(e){ if(S.history === hist && !S.feedback) S.feedback = 'Розбір не вдався: ' + e.message; }
        finally{ if(S.history === hist){ S.judging = false; again(); } }
      }
    }catch(e){ if(S.history === hist) st.err = 'Двигун відповів помилкою: ' + e.message; }
    finally{ if(S.history === hist && S.waiting){ S.waiting = false; again(); } }
  };
  const exit = () => {
    if(fromE3){ S.screen = 'result'; render(); return; }   /* Х24.4: підсумок заморожений */
    if(S.shift){
      S.shift.rows.push({sc, delta:bonusOf(S.cart) - bonusOf(sc.order), pot, fb:S.feedback, tries:S.attempt});
      S.shift.i++;
      if(S.shift.i < S.shift.queue.length) openScenario(S.shift.queue[S.shift.i]);
      else { S.screen = 'result'; render(); }
    } else { S.screen = 'picker'; render(); }
  };
  const retry = () => {
    S.history = []; S.cart = sc.order.slice(); S.ended = false; S.feedback = '';
    S.waiting = false; S.attempt++; S.phrase = ''; S.judging = false; render();
  };

  /* ── шапка ── */
  const tags = [el('span', {class:'v2-tag', text:sc.grp})];
  const mainCat = sc.main || sc.cats[0];
  if(mainCat) tags.push(el('span', {class:'v2-tag', text:S.LABEL[mainCat] || mainCat}));
  /* Х24.4: після зміни shift.i === queue.length, тож тег надрукував би «Замовлення 4 з 3» — глушимо. */
  if(S.shift && !fromE3) tags.push(el('span', {class:'v2-tag', text:'Замовлення ' + (S.shift.i + 1) + ' з ' + S.shift.queue.length}));
  const exitLabel = fromE3 ? 'Повернутися до підсумку'
    : !S.shift ? 'До списку' : S.shift.i + 1 < S.shift.queue.length ? 'Наступне замовлення' : 'До підсумку зміни';
  /* Х24.4: напис «назад» іде за входом — макет E2_BACK.e3. Обидві двері ведуть на E3:
     старий обробник робив S.shift = null і знищив би підсумок, до якого ми повертаємось. */
  const backLabel = fromE3 ? 'Повернутися до підсумку' : 'Повернутися до списку';
  const backGo = () => { if(fromE3){ S.screen = 'result'; render(); return; }
    S.shift = null; S.screen = 'picker'; render(); };
  /* X81: вихід переїхав у панель. Коротка форма — пара до `exitLabel`; повна
     лишається підказкою. П87: кнопки в шапці немає — немає й aria-label при ній. */
  V2_EXIT = { label: fromE3 ? 'До підсумку' : 'До списку', tip: backLabel, go: backGo };
  const appbar = el('header', {class:'appbar'}, [
    el('div', {class:'case-title'}, [
      el('h1', {text:sc.title}),
      el('p', {}, tags)]),
    S.ended ? el('button', {type:'button', class:'secondary', 'data-e2-end':'retry', onclick:retry}, ['Пройти ще раз']) : null,
    S.ended ? el('button', {type:'button', class:'primary', 'data-e2-end':'exit', onclick:exit}, [exitLabel]) : null]);

  /* ── про клієнта ── */
  const profile = el('section', {class:'panel profile-panel'}, [
    el('header', {class:'panel-head'}, [el('span', {class:'icon-chip'}, [icon('i-target')]), el('h2', {text:'Про клієнта'})]),
    el('div', {class:'profile'}, [
      el('div', {class:'person'}, [el('div', {class:'avatar', text:(sc.who || 'К').charAt(0).toUpperCase()}), el('b', {text:sc.who})]),
      el('dl', {}, [['Контекст', sc.mode], ['Характер', e1Cap(sc.character)], ['Настрій', sc.mood]].map(([k, v]) =>
        el('div', {class:'fact'}, [el('dt', {text:k}), el('dd', {text:v || '—'})]))),
      el('div', {class:'notice'}, [el('strong', {}, [icon('i-target'), 'Ваше завдання']),
        el('p', {text:sc.goal || 'Коректно опрацювати запит клієнта.'})]),
      el('div', {class:'hint'}, [icon('i-info'),
        el('span', {text:'Клієнт може не одразу озвучити додаткові потреби. Використовуйте професійні запитання.'})])])]);

  /* ── діалог ── */
  const bubble = (me, text, meta) => el('article', {class:'message' + (me ? ' pharmacist' : '')}, [
    me ? null : el('div', {class:'avatar', text:'К'}),
    el('div', {class:'bubble-wrap'}, [el('div', {class:'bubble', text}), meta ? el('time', {text:meta}) : null])]);
  const dots = label => el('div', {class:'typing', 'aria-label':label}, [el('i'), el('i'), el('i')]);
  const msgs = el('div', {class:'messages', 'aria-live':'polite'}, [bubble(false, sc.open, st.t0)]);
  for(const m of S.history)
    msgs.append(bubble(m.role === 'user', m.content, [m.t || '', STEP && m.step ? m.step : ''].filter(Boolean).join(' · ')));
  if(S.waiting) msgs.append(el('article', {class:'message'}, [el('div', {class:'avatar', text:'К'}), dots('Клієнт друкує')]));
  if(S.ended){
    const d0 = bonusOf(S.cart) - bonusOf(sc.order);
    msgs.append(el('p', {class:'talk-sys', text:'Розмову завершено'}),
      el('section', {class:'notice talk-review'}, [
        el('strong', {}, [icon('i-target'), sc.noSale ? 'РОЗБІР · правильна дія — не міняти' : 'РОЗБІР · приріст ' + uah(d0) + ' з ' + pot + ' ₴']),
        S.judging ? dots('Суддя пише розбір') : S.feedback ? el('p', {text:S.feedback}) : null,
        !S.judging && S.phrase ? el('p', {class:'talk-say'}, [el('b', {text:'Варто було сказати: '}), '«' + S.phrase + '»']) : null]));
  }
  if(st.err) msgs.append(el('p', {class:'talk-err', text:st.err}));
  const ta = el('textarea', {'aria-label':'Відповідь клієнту', 'data-e2-focus':'answer',
    placeholder:S.ended ? 'Розмову завершено' : 'Введіть відповідь клієнту…',
    oninput:e => { st.draft = e.target.value; },
    onkeydown:e => {
      if(e.key !== 'Enter' || e.isComposing || e.shiftKey) return;
      if(e.ctrlKey || e.metaKey || POINTER_FINE){ e.preventDefault(); say(); } }});
  ta.value = st.draft; ta.disabled = S.ended;
  const send = el('button', {type:'button', class:'send', 'aria-label':'Надіслати відповідь', onclick:say}, [icon('i-send')]);
  send.disabled = S.ended || S.waiting;
  const starters = E2_STARTERS.map(([label, text]) => {
    const b = el('button', {type:'button', onclick:() => { ta.value = text + '. ' + ta.value; st.draft = ta.value; ta.focus(); }}, [label]);
    b.disabled = S.ended; return b; });
  const dialogue = el('section', {class:'panel dialogue'}, [
    el('header', {class:'panel-head'}, [el('span', {class:'icon-chip'}, [icon('i-chat')]), el('h2', {text:'Діалог з клієнтом'})]),
    msgs,
    el('div', {class:'composer'}, [
      el('div', {class:'comp-isl'}, [
        el('div', {class:'quick-phrases'}, starters),
        el('div', {class:'well'}, [ta, send])])])]);

  /* ── замовлення: без грошей (Р1) ── */
  const inCart = S.cart.map(c => S.ALL[c]).filter(Boolean);
  const cart = el('section', {class:'panel'}, [
    el('header', {class:'panel-head cart-head'}, [el('span', {}, [icon('i-cart'), el('h2', {text:'Поточне замовлення'})]),
      el('span', {class:'pill', text:e2Pos(inCart.length)})]),
    el('div', {class:'cart-list'}, inCart.map(it => el('div', {class:'cart-row'}, [
      el('span', {class:'product-art'}, [icon('i-box')]),
      el('div', {class:'cart-name'}, [it.n, el('small', {text:S.LABEL[it.cat] || ''}), el('span', {class:'cart-code', text:it.c})])]))),
    el('div', {class:'quiet-note'}, [icon('i-info'),
      el('span', {text:'Це замовлення клієнта. Змінити його можна лише після згоди клієнта в розмові.'})])]);

  /* ── запропонувати позицію: дві вкладки (Р2); список перемальовується сам, без render() ── */
  const list = el('div', {class:'proposals'});
  const more = el('button', {type:'button', onclick:() => { st.more = true; fill(); }}, ['Показати більше товарів']);
  const propose = it => {
    if(S.ended) return;
    const add = 'Можу запропонувати ' + it.n + '. ';
    ta.value = st.draft.trim() ? st.draft.replace(/\s*$/, ' ') + add : add;
    st.draft = ta.value; ta.focus();
    e2Toast('Назву підставлено в поле відповіді. Чек змінить лише згода клієнта.');
  };
  function fill(){
    const base = st.tab === 'case' ? poolOf(sc).map(i => S.ALL[i.c] || i) : Object.values(S.ALL);
    const t = st.term.trim().toLowerCase(), found = base.filter(it => it.n.toLowerCase().includes(t));
    const shown = st.more ? found : found.slice(0, E2_LIMIT);
    list.replaceChildren(...(shown.length ? shown.map(it => {
      const plus = el('button', {type:'button', class:'plus', 'data-code':it.c, 'aria-label':'Запропонувати ' + it.n, onclick:() => propose(it)}, ['+']);
      plus.disabled = S.ended;
      return el('div', {class:'proposal-row'}, [el('span', {class:'product-art'}, [icon('i-box')]),
        el('div', {class:'proposal-name'}, [it.n, el('small', {text:S.LABEL[it.cat] || ''})]),
        el('span', {class:'price', text:v2money(it.p)}), plus]); })
      : [el('p', {class:'talk-empty', text:'Нічого не знайдено'})]));
    more.hidden = st.more || found.length <= E2_LIMIT;
  }
  const tabs = [['case', 'Для цієї ситуації'], ['all', 'Усі товари']].map(([key, label]) => el('button', {type:'button',
    class:'tab' + (st.tab === key ? ' active' : ''), role:'tab', 'aria-selected':String(st.tab === key), 'data-pool':key,
    onclick:e => { st.tab = key; st.more = false;
      tabs.forEach(b => { const on = b === e.currentTarget; b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on)); });
      fill(); }}, [label]));
  const search = el('input', {type:'search', placeholder:'Пошук товару…', 'aria-label':'Пошук товару', 'data-e2-focus':'search',
    oninput:e => { st.term = e.target.value; st.more = false; fill(); }});
  search.value = st.term;
  fill();
  const offer = el('section', {class:'panel'}, [
    el('header', {class:'panel-head'}, [el('span', {class:'icon-chip'}, [icon('i-bag')]), el('h2', {text:'Запропонувати позицію'})]),
    el('div', {class:'catalog'}, [el('label', {class:'search'}, [icon('i-search'), search]),
      el('div', {class:'v2-tabs', role:'tablist'}, tabs), list, el('div', {class:'catalog-foot'}, [more])])]);

  /* ── службовий канал ?mock (панель перевірки кроку 1) — міст: клас .mock старого CSS ── */
  const mock = !MOCK ? null : el('div', {class:'mock'}, [
    el('h4', {text:'Панель перевірки · крок 1'}),
    el('p', {text:'Живої моделі немає. Тут чек складається руками так, ніби клієнт погодився.'}),
    el('div', {class:'mockcols'}, poolOf(sc).map(it => { const id = 'm_' + it.c;
      return el('label', {for:id}, [
        el('input', {type:'checkbox', id, ...(S.cart.includes(it.c) ? {checked:'checked'} : {}),
          onchange:e => { S.cart = e.target.checked ? [...S.cart, it.c] : S.cart.filter(x => x !== it.c); again(); }}),
        el('span', {text:' ' + it.n + ' · ' + uah(it.b) + ' ₴ · ' + (it.k || '—')})]); }))]);

  const wrap = el('div', {class:'talk'}, [appbar,
    el('div', {class:'workspace'}, [profile, dialogue, el('aside', {class:'cart-panel'}, [cart, offer, mock])]),
    el('div', {class:'toast', role:'status'})]);
  queueMicrotask(() => {
    msgs.scrollTop = msgs.scrollHeight;
    if(st.focus){ const n = wrap.querySelector('[data-e2-focus="' + st.focus + '"]'); st.focus = ''; if(n && !n.disabled) n.focus(); }
  });
  return wrap;
}
V2.game = Talk;

/* ── Х24.2 · E3 «Підсумок зміни» — Summary(). Підключено Х24.3: V2.result = Summary (у кінці блоку) ──
   DOM — renderSummary макета (П28). Арифметика — старого Result дослівно: got/pot/pct/slips/retries,
   «не міняти» — поза відсотком. Розбір — РАЗ на зміну в S.shift.debrief (старий Result кликав
   debrief на кожен рендер — повторний платний запит); пізня відповідь чужої зміни відкидається.
   Повторні спроби — форма макета (inline-стиль, кольори — токени). Промах: b — назва · small — причина · em — тип замовлення (номер знято, Х25.2а). Дія .slip — Х24.4. */
function Summary(){
  const sh = S.shift, rows = sh.rows, scored = rows.filter(r=>!r.sc.noSale);
  const got = scored.reduce((a,r)=>a+r.delta,0);
  const pot = scored.reduce((a,r)=>a+r.pot,0)||1;
  const pct = Math.max(0,Math.min(100,Math.round(got/pot*100)));
  const slips = rows.filter(r=>r.delta<0||(r.sc.noSale&&r.delta>0));
  const retries = rows.reduce((a,r)=>a+((r.tries||1)-1),0);
  const kind = sc => sc.noSale ? 'Не міняти' : sc.trap ? 'Пастка' : sc.grp;
  const why = r => r.sc.noSale && r.delta>0 ? 'продаж там, де «не міняти»' : 'стало гірше: −' + uah(-r.delta) + ' ₴';
  const toE1 = () => { S.shift = null; S.screen = 'picker'; render(); };
  if(!MOCK && !sh.debrief){
    sh.debrief = {st:'wait'};
    engineLive.debrief(rows).then(d => { if(S.shift !== sh) return;
      sh.debrief = {st:'ok', d}; sh.curatorNote = d.curator; if(S.screen === 'result') render(); })
    .catch(e => { if(S.shift !== sh) return;
      sh.debrief = {st:'err', msg:e.message}; if(S.screen === 'result') render(); });
  }
  const metric = (cls, label, value, bar) => el('article', {class:'metric' + (cls ? ' ' + cls : '')},
    [el('small', {text:label}), el('strong', {text:value}),
     bar == null ? null : el('div', {class:'metric-bar'}, [el('i', {style:'width:' + bar + '%'})])]);
  const item = (ic, head, text) => el('div', {class:'review-item'}, [icon(ic), el('div', {}, [el('strong', {text:head}), el('span', {text})])]);
  const db = sh.debrief;
  const review = MOCK ? [el('p', {class:'coach-overall', text:'Заглушка: у робочому режимі тут зʼявиться розбір від наставника.'})]
    : !db || db.st === 'wait' ? [el('p', {class:'coach-overall', text:'Наставник читає вашу зміну…'})]
    : db.st === 'err' ? [el('p', {class:'coach-overall', text:'Розбір не вдався: ' + db.msg + ' Результат зміни збережено — його видно вище.'})]
    : [el('div', {class:'review-grid'}, [el('p', {class:'coach-overall', text:db.d.overall}),
        el('div', {class:'review-list'}, [...(db.d.mistakes||[]).map(t=>item('i-info', 'Повторюється', t)),
                                          ...(db.d.strengths||[]).map(t=>item('i-check', 'Виходить стабільно', t))])]),
       el('div', {class:'review-list', style:'margin-top:15px'}, (db.d.rules||[]).map(t=>item('i-check', 'Наступного разу', t)))];
  return el('div', {class:'page summary-wrap'}, [
    el('header', {class:'page-title'}, [
      el('div', {}, [el('h1', {text:'Підсумок зміни'}),
        el('p', {text:'Завершено розмов: ' + rows.length + '. Ось що повторюється у вашій практиці.'})]),
      el('button', {type:'button', class:'secondary', onclick:toE1}, ['До тренувань'])]),
    el('div', {id:'summary'}, [
      el('div', {class:'summary-grid'}, [
        metric('accent', 'Виконано від орієнтиру', pct + '%', pct),
        metric('positive', 'Додано за зміну', (got>0 ? '+' : '') + uah(got) + ' ₴'),
        metric('', 'Орієнтир зміни', uah(pot) + ' ₴'),
        metric('', 'Завершено розмов', String(rows.length))]),
      el('section', {class:'summary-section'}, [
        el('h2', {}, [icon('i-info'), ' На що звернути увагу']),
        el('p', {text:'Промахи — це розмови, де результат став гіршим або де пропозиція була недоречною.'}),
        slips.length ? el('div', {class:'slips'}, slips.map((r,i) => el('button', {type:'button', class:'slip', 'data-slip':String(r.sc.id), onclick:() => openScenario(r.sc, 'e3')}, [
            el('span', {text:String(i+1)}), el('div', {}, [el('b', {text:r.sc.title}), el('small', {text:why(r)}), el('em', {text:kind(r.sc)})])])))
          : el('p', {text:'Промахів у цій зміні немає'})]),
      el('section', {class:'summary-section'}, [el('h2', {}, [icon('i-target'), ' Розбір наставника']), ...review]),
      retries ? el('div', {class:'final-actions'}, [
        el('span', {style:'margin-right:auto;align-self:center;color:var(--anc-gray);font-size:13px'}, ['Повторні спроби: ', el('b', {style:'color:var(--anc-text)', text:String(retries)})])]) : null])]);
}
V2.result = Summary;

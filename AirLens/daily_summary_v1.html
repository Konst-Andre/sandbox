<title>Підсумок дня v1</title>

<style>
:root{--bg:#c9d9e6;--bub:#fff;--tx:#0f1419;--mut:#5f6e7d;--ln:#d5dde5;--btn:#2a74b8;--acc:#1f6aad}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1621;--bub:#182533;--tx:#e9eef4;--mut:#8b9bab;--ln:#2b3b4d;--btn:#2f6ea5;--acc:#64b5ef}}
:root[data-theme="dark"]{--bg:#0e1621;--bub:#182533;--tx:#e9eef4;--mut:#8b9bab;--ln:#2b3b4d;--btn:#2f6ea5;--acc:#64b5ef}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif}
main{max-width:375px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 2px}.lead{color:var(--mut);font-size:13px;margin:0 0 14px}
.lab{font-size:13px;font-weight:600;color:var(--acc);margin:22px 0 6px}
.note{font-size:13px;color:var(--mut);margin:6px 2px 0}
.bub{background:var(--bub);border-radius:16px 16px 16px 4px;padding:8px 10px 6px;max-width:330px}
.bub h3{font-size:16px;margin:2px 0 8px}
.bub table{border-collapse:collapse;width:100%;font-size:15px}
.bub td{border:1px solid var(--ln);padding:5px 7px;vertical-align:top}
.bub td small{color:var(--mut);font-size:13px}
.bub footer{color:var(--mut);font-style:italic;font-size:13px;margin-top:8px}
.bub pre{font:inherit;white-space:pre-wrap;margin:0}
.time{text-align:right;font-size:12px;color:var(--mut)}
.al-btn{display:block;background:var(--btn);color:#fff;text-align:center;border-radius:10px;padding:8px;margin-top:4px;max-width:350px;font-weight:600}
</style></head><body><main>

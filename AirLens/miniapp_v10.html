<title>AirLens Mini App · мокап v10</title>
<!--
  AirLens — мокап Mini App, хід 5а, версія 10. Прев'ю-стенд: sandbox/AirLens/miniapp_v10.html
  v9 → v10 (Konst 29.09): «День» · «Усі» — без картки «Робочий день» (злиті тривоги всіх громад без «де» не читаються;
  розріз дає «По громадах» і «Події»); картка — лише для обраної громади.
  v8 → v9 (Konst 29.09): «Тиждень» — поточний тиждень Пн–Пт по порядку (майбутні дні порожні);
  «без тривоги» — зелена точка-вогник (як 🟢 на табло бота) замість галочки: галочка читається як «безпечно / все гаразд» (П-1.3).
  живе доки: хід 5б переносить його в miniapp/ (живий Mini App); далі — історія.
  v7 → v8 (сесія 5, 29.09 — вироки стейдж-бенча, AirLens DECISIONS Р-31 · Р-32 · Р-33):
  «Місяць» — календар будніх днів, у дні тривога в робочий час «1 год 07», колір — 5 квантильних рівнів; тихий день — лунка,
  день з тривогою — піднята плитка; ‹ Серпень / Вересень › — підняті пігулки; рік — у втопленій пігулці біля легенди;
  дотик на день → кільце й картка дня — розклад 09–18. «День» — той самий розклад; поза робочим часом у звітах нічого (Р-33).
  «Тиждень» — 5 робочих днів. Тиждень і Місяць рахуються з синтетичних інтервалів (генератор AirLens/tools/bench), жовті — теж тривога.
  Іконки вкладок — Lucide (ISC License, Copyright (c) 2026 Lucide Icons and Contributors): сирена · звіт-файл · місто, тон-заливка активної.
  v5 → v6 (Konst 29.09): підсумок звітів — бейдж періоду + «09:00–18:00» у втопленні; таці — текст над повзунком
  (власний шар, гліч iOS); «Назад» — кнопка Telegram + піднята пігулка; теми «Темна»/«Світла»;
  годинник замість зеленої крапки; одиниці легші за числа; області — центр області замість заглушки.
  v6 → v7 (Konst 29.09): тексти підсумку Konst; «Події» і «По громадах» — заголовок у картці (одна мова з «Без тривоги»);
  масштаб коротко («весь район») в один рядок; у темній — стриманіший червоний і нейтральні внутрішні картки героя;
  назва групи в один рядок, «дані на» — під нею; бейдж у світлій — з кантом. Дані синтетичні, час мокапа — 14:20.
  v4 → v5 (коментарі Konst 29.09): підсумок звітів читається згори вниз (що → скільки → частка → кількість);
  доба = робочий день 09–18 з підписаними тривогами; місяць — дві картки-відповіді; роздільники з відступами
  з обох боків; капсула ≤ 112 px; таці без стиску при натисканні (гліч iOS); банер тривоги з об'ємом;
  аватар = перемикач груп.
  Service worker: не реєструється (PREVIEW §3 п.5).
  v3 → v4 (коментарі Konst 29.09): власні теми «Графіт» (типова) і «Світла» з перемикачем у ⋯ → Налаштування;
  капсула вкладок — піднята поверхня; усі таці (період, громади, частини країни) — повзунок-пружина A54;
  «станом на» — у втопленій пігулці; без технічних підписів; звіти з фільтром громади;
  «У групі» — перетягування за ручку; кнопка Excel — контур замість розлитої тіні.
  Усі кольори й матеріал — токени на .phone[data-theme]: наступний хід робить із них важелі стенда.
-->
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xl:18px;--r-lg:14px;--r-md:11px;--r-sm:8px;
  --seg-dur:450ms;--seg-ease:cubic-bezier(.34,1.56,.64,1);    /* A54 */
  --nav-dur:400ms;--nav-ease:cubic-bezier(.34,1.3,.64,1);      /* A56 */
  --page-demo:#e9e9ee;--ink-demo:#3a3a40;
}
@media (prefers-color-scheme:dark){:root{--page-demo:#0e0e10;--ink-demo:#c9c9cf}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page-demo);color:var(--ink-demo);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ───────── стенд (не частина застосунку) ───────── */
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px 48px;flex-wrap:wrap}
.controls{width:260px;max-width:100%;font-size:14px;line-height:1.4}
.controls h1{font-size:16px;margin:0 0 12px}
.ctl{margin:0 0 14px}
.ctl-label{display:block;font-weight:600;font-size:12px;opacity:.65;margin-bottom:6px}
.seg-demo{display:flex;flex-wrap:wrap;gap:6px}
.seg-demo button{border:1px solid color-mix(in srgb,var(--ink-demo) 25%,transparent);background:transparent;border-radius:999px;padding:8px 12px;min-height:36px;cursor:pointer}
.seg-demo button[aria-pressed="true"]{background:var(--ink-demo);color:var(--page-demo);border-color:var(--ink-demo)}
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100dvh - 48px);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 12px 36px rgba(0,0,0,.18);background:var(--page);color:var(--text)}
@media (max-width:520px){.stage{padding:0;gap:0}.phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}.controls{padding:20px 16px 40px;width:100%}}

/* ───────── ТЕМИ AirLens (власні, не з Telegram) ───────── */
.phone[data-theme="graphite"]{
  --page:#131b24;--card:#1c2733;--raised-c:#2a3746;--sep:#2b3947;--text:#ffffff;--hint:#93a3b4;--hint-well:#a9b7c6;
  --accent:#4a93f8;--accent-ink:#8cc0ff;--accent-solid:#2a6cc8;--on-accent:#ffffff;--accent-tint:color-mix(in srgb,#4a93f8 18%,#1c2733);
  --alert:#F0685C;--alert-ink:#F68A80;--alert-bg:#3f1d25;--alert-sub:rgba(255,255,255,.07);
  --warn:#DFA43A;--warn-ink:#E4AE4E;--warn-bg:#40361f;
  --nodata:#9AA6B3;--nodata-ink:#AEB9C5;--nodata-bg:#253140;
  --calm:#2FA868;
  --hist:#b4574f;--hist-now:#F0685C;--hist-zero:#243140;          /* історія тривог: приглушений червоний */
  --card-sh:inset 0 1px 0 rgba(255,255,255,.07);
  --light-top:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%);   /* світло зверху */
  --hero-sh:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.25);
  --well:#0f161e;--well-sh:inset 0 1.5px 3px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.06);
  --raised-bd:transparent;--raised:linear-gradient(180deg,#34445a,#2a3848);--raised-sh:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.35);
  --btn-sh:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3);--btn-bd:rgba(0,0,0,.25);
  --glass:rgba(28,39,51,.86);--glass-rim:rgba(255,255,255,.06);
  --bar:#1c2733;--toast-bg:#34445a;--toast-act:#9fd0ff;--scrim:rgba(0,0,0,.5);
  --pin-bg:#3f1d25;--pin-bd:rgba(240,104,92,.30);--pin-sh:inset 0 1px 0 rgba(255,255,255,.10),0 4px 14px rgba(0,0,0,.35);
  --hit-bg:#232d3a;--hit-sh:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.30);
  --line:rgba(255,255,255,.07);
}
.phone[data-theme="light"]{
  --page:#efeff4;--card:#ffffff;--raised-c:#ffffff;--sep:#e3e3e8;--text:#000000;--hint:#606064;--hint-well:#56565b;
  --accent:#2481cc;--accent-ink:#1d67a3;--accent-solid:#1f6fb0;--on-accent:#ffffff;--accent-tint:color-mix(in srgb,#2481cc 12%,#fff);
  --alert:#C4221A;--alert-ink:#A51C15;--alert-bg:#faebea;--alert-sub:rgba(255,255,255,.75);
  --warn:#B87200;--warn-ink:#8A5300;--warn-bg:#fcf1de;
  --nodata:#6B7079;--nodata-ink:#5F646D;--nodata-bg:#eeeff1;
  --calm:#1E8A4C;
  --hist:#d9837e;--hist-now:#C4221A;--hist-zero:#f1f1f4;
  --card-sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --light-top:none;
  --hero-sh:0 1px 2px rgba(0,0,0,.05),0 12px 30px color-mix(in srgb,var(--glow,#000) 14%,transparent);
  --well:#e5e5ea;--well-sh:inset 0 1px 3px rgba(0,0,0,.13);
  --raised:linear-gradient(180deg,#fff,#f7f7f9);--raised-sh:0 1px 2px rgba(0,0,0,.10),0 3px 10px rgba(0,0,0,.08);--raised-bd:rgba(0,0,0,.09);
  --btn-sh:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.18);--btn-bd:#17588d;   /* контур, не розлита тінь */
  --glass:rgba(247,247,249,.86);--glass-rim:rgba(0,0,0,.07);
  --bar:#f7f7f9;--toast-bg:#2c2c2e;--toast-act:#8cc4ff;--scrim:rgba(0,0,0,.28);
  --pin-bg:#fce4e2;--pin-bd:rgba(196,34,26,.30);--pin-sh:0 1px 2px rgba(196,34,26,.10),0 4px 14px rgba(196,34,26,.14);
  --hit-bg:#ffffff;--hit-sh:0 1px 2px rgba(0,0,0,.06),0 3px 10px rgba(196,34,26,.08);
  --line:rgba(0,0,0,.08);
}

/* ───────── смуга Telegram ───────── */
.tg-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;padding:0 6px 0 14px;background:var(--bar);border-bottom:1px solid var(--sep);font-size:16px}
.tg-bar .l{color:var(--accent-ink);justify-self:start;border:0;background:transparent;font-size:16px;min-height:44px;padding:0;cursor:pointer}.tg-bar .c{text-align:center;line-height:1.1}.tg-bar .c b{display:block;font-size:16px}.tg-bar .c small{font-size:12px;color:var(--hint)}
.tg-bar .r{justify-self:end;border:0;background:transparent;color:var(--accent-ink);font-size:22px;min-width:44px;min-height:44px;cursor:pointer;letter-spacing:1px}

/* ───────── каркас ───────── */
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:0 16px 112px;-webkit-overflow-scrolling:touch}
.screen[hidden]{display:none}
.head{display:flex;align-items:center;gap:12px;padding:16px 2px 14px}
.head h1{font-size:24px;line-height:1.15;margin:0;letter-spacing:-.015em;font-weight:700;flex:1;min-width:0}
.grpbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;min-height:44px;cursor:pointer;flex:1;min-width:0;color:var(--text);text-align:left}
.grpbtn h1{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gtxt{display:grid;gap:5px;min-width:0}
.gline{display:flex;align-items:center;gap:6px;min-width:0}
.gtxt .fresh{justify-self:start;min-height:24px;padding:0 9px;font-size:12px}
.grpbtn .dd{color:var(--hint);font-size:14px}
.ava{width:48px;height:48px;font-size:19px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background-color:#2560bd;background-image:linear-gradient(160deg,#3a7fe0,#1f55ac);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.fresh{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:999px;background:var(--well);box-shadow:var(--well-sh);font-size:13px;color:var(--hint-well);font-variant-numeric:tabular-nums;white-space:nowrap}
.fresh svg{width:13px;height:13px;flex:none}
.fresh.stale{background:var(--nodata-bg);color:var(--nodata-ink);font-weight:600}

.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 2px 8px;font-size:15px;font-weight:600;min-height:24px}
.sec .act{border:0;background:transparent;color:var(--accent-ink);font-size:15px;font-weight:600;min-height:44px;margin:-10px -8px;padding:0 8px;cursor:pointer}
.card{background:var(--card);background-image:var(--light-top);border-radius:var(--r-lg);box-shadow:var(--card-sh);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;font-size:13px;font-weight:600;color:var(--hint)}
.count{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;background:var(--well);box-shadow:var(--well-sh);font-size:12px;font-weight:600;color:var(--hint-well);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.i-alert{color:var(--alert)}.i-yellow{color:var(--warn)}.i-nodata{color:var(--nodata)}.i-calm{color:var(--calm)}

.pin{position:sticky;top:0;z-index:4;margin:0 -16px;padding:8px 16px 0;background:var(--page)}
.pin[hidden]{display:none}
.pin button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:1px solid var(--pin-bd);border-radius:var(--r-md);padding:0 12px;background:var(--pin-bg);color:var(--alert-ink);font-size:15px;font-weight:600;cursor:pointer;text-align:left;box-shadow:var(--pin-sh)}
.pin[data-s="yellow"] button{background:var(--warn-bg);color:var(--warn-ink)}
.pin svg{width:18px;height:18px;flex:none}
.pin .go{margin-left:auto;font-size:20px;line-height:1}

/* ───────── ГЕРОЙ ───────── */
.hero{border-radius:var(--r-xl);padding:16px 14px 14px;box-shadow:var(--hero-sh);border:1px solid transparent;background-image:var(--light-top)}
.hero[data-s="alert"]{background-color:var(--alert-bg);border-color:color-mix(in srgb,var(--alert) 32%,transparent);--glow:var(--alert)}
.hero[data-s="yellow"]{background-color:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 34%,transparent);--glow:var(--warn)}
.hero[data-s="nodata"]{background-color:var(--nodata-bg);border-color:color-mix(in srgb,var(--nodata) 30%,transparent)}
.hero[data-s="calm"]{background-color:var(--card)}
.hero-top{display:flex;gap:12px;align-items:center;padding:0 2px}
.hero-top svg{width:34px;height:34px;flex:none}
.hero h2{margin:0;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.hero[data-s="alert"] h2{color:var(--alert-ink)}.hero[data-s="yellow"] h2{color:var(--warn-ink)}
.hero[data-s="calm"] h2{font-size:18px;font-weight:600}
.hero .call{margin:2px 0 0;font-size:17px;font-weight:700}
.hits{display:grid;gap:6px;margin-top:14px}
.hit{display:flex;align-items:center;gap:12px;background:var(--hit-bg);border-radius:var(--r-md);padding:10px 12px;min-height:58px;box-shadow:var(--hit-sh)}
.hit .b{flex:1;min-width:0}.hit .n{font-size:17px;font-weight:600}
.hit .t{font-size:14px;margin-top:2px}.hit .t b{font-weight:600}
.hit .t span,.hit .d small{color:color-mix(in srgb,var(--text) 74%,transparent)}
.hit .d{text-align:right;white-space:nowrap}
.hit .d b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.hit .d small{font-size:12px;font-variant-numeric:tabular-nums}
.hero[data-s="alert"] .hit .d b{color:var(--alert-ink)}.hero[data-s="yellow"] .hit .d b{color:var(--warn-ink)}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative;background:var(--card)}
.row + .row::before{content:"";position:absolute;top:0;left:46px;right:16px;height:1px;background:var(--line)}
.row .ic{width:18px;height:18px;flex:none}
.row .n{flex:1;font-size:16px;min-width:0}
.row .n small{display:block;font-size:12px;color:var(--hint)}
.row .v{font-size:13px;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v.al{color:var(--alert-ink);font-weight:600}
.card .row{background:transparent}

/* ───────── ТАЦЯ з повзунком-пружиною — одна для періоду, громад і частин країни (A54 · A65) ───────── */
.tray{position:relative;isolation:isolate;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--well);box-shadow:var(--well-sh);overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray-i{flex:1 0 auto;position:relative;z-index:1;transform:translateZ(0);-webkit-backface-visibility:hidden;border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:9px;font-size:15px;font-weight:600;color:var(--hint-well);cursor:pointer;white-space:nowrap;transition:color .14s}
.tray-i[aria-selected="true"]{color:var(--text)}
.tray .thumb{position:absolute;z-index:0;will-change:transform;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--raised);box-shadow:var(--raised-sh);opacity:0;pointer-events:none;transition:transform var(--seg-dur) var(--seg-ease),width var(--seg-dur) var(--seg-ease)}
.tray .thumb.snap{transition:none}
.tray.sm .tray-i{min-height:36px;font-size:14px}
.gap{height:12px}

/* ───────── ЗВІТИ ───────── */
.rhero{margin-top:12px;padding:16px}
.rhero .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.rhero .k{font-size:14px;color:var(--hint);margin-top:2px}
.rhero .badge{border:1px solid var(--raised-bd);display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:var(--raised);box-shadow:var(--raised-sh);font-size:13px;font-weight:700}
.rhero .hours{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:999px;background:var(--well);box-shadow:var(--well-sh);font-size:12px;color:var(--hint-well);font-variant-numeric:tabular-nums}
.rhero .hours svg{width:12px;height:12px}
.rhero .big{margin-top:2px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--well);box-shadow:var(--well-sh);margin:14px 0 10px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hist)}
.rmeta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--hint)}
.rmeta b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
.rhero .big{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.rhero .big small{font-size:17px;font-weight:600;color:var(--hint)}
.lst .r{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;min-height:56px;position:relative;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.lst .r + .r::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.lst .r .n{flex:1;font-size:16px}.lst .r .n small{display:block;font-size:13px;color:var(--hint);margin-top:1px}
.lst .r .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lst .r .v.zero{color:var(--hint);font-weight:400}
.u{font-weight:400;color:var(--hint)}
.rd .s b{color:var(--text);font-weight:700}
.lst .r .chev{color:var(--hint);font-size:20px}
/* доба: робочий день 09–18, тривоги підписані */
.wday{padding:16px 16px 14px}
.wday .cap-t{display:flex;justify-content:space-between;font-size:13px;color:var(--hint);margin-bottom:10px}
.wtrack{position:relative;height:44px;border-radius:10px;background:var(--well);box-shadow:var(--well-sh);overflow:hidden}
.wtrack .future{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--text) 6%,transparent) 6px 8px)}
.wtrack .ev{position:absolute;top:8px;bottom:8px;border-radius:6px;background:var(--hist);min-width:6px}
.wtrack .ev.now{background:var(--hist-now)}
.wtrack .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.wlbl{position:relative;height:34px;margin-top:6px}
.wlbl span{position:absolute;transform:translateX(-2px);font-size:12px;line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
.wlbl span b{display:block;font-size:13px}
.wlbl span.now b{color:var(--alert-ink)}
.waxis{display:flex;justify-content:space-between;font-size:11px;color:var(--hint);margin-top:6px;font-variant-numeric:tabular-nums}
.wnote{font-size:13px;color:var(--hint);margin-top:10px}
/* доба */
.day{padding:30px 16px 12px}
.strip{position:relative;height:40px;border-radius:9px;background:var(--well);box-shadow:var(--well-sh)}
.strip .work{position:absolute;top:0;bottom:0;left:37.5%;width:37.5%;background:color-mix(in srgb,var(--text) 6%,transparent);border-left:1px dashed color-mix(in srgb,var(--text) 22%,transparent);border-right:1px dashed color-mix(in srgb,var(--text) 22%,transparent)}
.strip .ev{position:absolute;top:8px;bottom:8px;border-radius:5px;background:var(--hist);min-width:6px}
.strip .ev.now{background:var(--hist-now)}
.strip .nowline{position:absolute;top:-6px;bottom:-6px;width:2px;border-radius:1px;background:var(--text)}
.strip .nowlbl{position:absolute;top:-22px;background:var(--card);padding:0 3px;border-radius:3px;transform:translateX(-50%);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.axis{position:relative;height:16px;margin-top:8px;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.axis span{position:absolute;transform:translateX(-50%)}.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.axis .wk{color:var(--text);font-weight:600}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-top:8px}
.key i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px}
.evs .e{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;position:relative;align-items:baseline}
.evs .e + .e::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.evs .t{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.evs .w{font-size:15px}.evs .d{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.evs .s{grid-column:2/4;font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evs .e.now .t,.evs .e.now .d{color:var(--alert-ink)}
.evs .e.off .t,.evs .e.off .d,.evs .e.off .w{color:var(--hint);font-weight:400}
/* тиждень */
.week{padding:16px 12px 12px;position:relative}
.week .max{position:absolute;left:12px;right:12px;top:48px;border-top:1px dashed color-mix(in srgb,var(--text) 22%,transparent);font-size:11px;color:var(--hint)}
.week .max span{position:absolute;right:0;top:-16px}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;color:var(--text)}
.wd b{font-size:12px;line-height:1.2;min-height:30px;display:flex;align-items:flex-end;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.wd .col{width:100%;max-width:30px;height:120px;border-radius:7px;background:var(--well);box-shadow:var(--well-sh);position:relative;overflow:hidden}
.wd .col i{position:absolute;left:3px;right:3px;bottom:3px;border-radius:5px;background:var(--hist)}
.wd span{font-size:12px;color:var(--hint)}
.wd.cur span{color:var(--text);font-weight:700}
.wd.fut .col{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
/* місяць */
.hm{padding:14px 12px 12px}
.hm-grid{position:relative;display:grid;grid-template-columns:24px repeat(24,1fr);gap:2px;align-items:center;margin-top:18px}
.hm-grid .dl{font-size:11px;color:var(--hint-well)}
.hm-cell{aspect-ratio:1/1.3;border-radius:3px;border:0;padding:0;cursor:pointer;min-width:0;background:color-mix(in srgb,var(--hist) var(--p,0%),var(--hist-zero))}
.hm-cell.sel{outline:2px solid var(--text);outline-offset:1px}
.hm-work{position:absolute;border-radius:5px;border:1.5px dashed color-mix(in srgb,var(--text) 38%,transparent);pointer-events:none}
.hm-worklbl{position:absolute;top:-19px;font-size:11px;color:var(--hint)}
.hm-hours{display:grid;grid-template-columns:24px repeat(8,1fr);font-size:11px;color:var(--hint);margin-top:4px;font-variant-numeric:tabular-nums}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--hint);margin-top:10px}
.hm-legend i{width:16px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--hist) var(--p),var(--hist-zero))}
.hm-cap{font-size:13px;color:var(--hint)}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rd{padding:14px}
.rd .k{font-size:13px;color:var(--hint)}
.rd .v{font-size:17px;font-weight:600;margin-top:6px;line-height:1.25}
.rd .v b{font-weight:700}
.rd .s{font-size:13px;color:var(--hint);margin-top:4px;font-variant-numeric:tabular-nums}
.pick{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:var(--r-sm);background:var(--well);box-shadow:var(--well-sh)}
.pick[hidden]{display:none}
.read{margin-top:10px;display:grid;gap:6px}
.read div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 12px;border-radius:var(--r-sm);background:var(--well);box-shadow:var(--well-sh)}
.read span{color:var(--hint-well)}.read b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:1px solid var(--btn-bd);border-radius:var(--r-md);background:var(--accent-solid);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0));color:var(--on-accent);font-size:17px;font-weight:700;cursor:pointer;margin-top:24px;box-shadow:var(--btn-sh);transition:transform 280ms cubic-bezier(.34,1.5,.64,1)}
.btn svg{width:20px;height:20px}

/* ───────── ГРОМАДИ ───────── */
.search{display:flex;align-items:center;gap:8px;background:var(--well);box-shadow:var(--well-sh);border-radius:12px;padding:0 12px;min-height:48px}
.search svg{width:18px;height:18px;color:var(--hint-well);flex:none}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);min-height:48px;outline:none;min-width:0}
.search input::placeholder{color:var(--hint-well)}
.search:focus-within{box-shadow:var(--well-sh),0 0 0 2px var(--accent)}
.res{display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;min-height:56px;position:relative}
.res + .res::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.res .b{flex:1;min-width:0}.res .n{font-size:16px}.res .o{font-size:13px;color:var(--hint)}
.pill{border:0;border-radius:999px;min-height:36px;min-width:44px;padding:0 14px;font-size:14px;font-weight:600;background:var(--accent-tint);color:var(--accent-ink);cursor:pointer;transition:transform 280ms cubic-bezier(.34,1.5,.64,1)}
.pill.done{background:transparent;color:var(--hint);font-weight:400;cursor:default}
.nav-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:0 16px;min-height:48px;font-size:16px;text-align:left;cursor:pointer;position:relative;color:var(--text)}
.nav-row + .nav-row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.nav-row .cnt{margin-left:auto}
.nav-row .chev{color:var(--hint);font-size:20px;margin-left:auto}
.nav-row .cnt + .chev{margin-left:0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--raised);box-shadow:var(--raised-sh);color:var(--text);font-size:15px;font-weight:600;min-height:40px;padding:0 14px 0 10px;border-radius:999px;cursor:pointer;margin:14px 0 10px}
.back i{font-style:normal;color:var(--accent-ink);font-size:20px;line-height:1}
.empty{padding:18px 16px;font-size:15px;color:var(--hint)}
.grp .row{min-height:56px;padding-top:6px;padding-bottom:6px;transition:transform .2s cubic-bezier(.4,0,.2,1)}
.grp .ed{display:none}.grp.editing .ed{display:grid}
.grp.editing .ic,.grp.editing .v{display:none}
.grp.editing .row::before{left:56px}
.grp .minus{place-items:center;width:44px;height:44px;margin-left:-12px;border:0;background:transparent;cursor:pointer}
.grp .minus i{display:block;width:22px;height:22px;border-radius:50%;background:var(--alert);position:relative}
.grp .minus i::after{content:"";position:absolute;left:5px;right:5px;top:10px;height:2px;border-radius:1px;background:#fff}
.grp .minus:disabled{cursor:not-allowed}.grp .minus:disabled i{background:color-mix(in srgb,var(--hint) 45%,transparent)}
.grp .handle{place-items:center;width:44px;height:44px;margin-right:-10px;color:var(--hint);cursor:grab;touch-action:none}
.grp .handle svg{width:22px;height:22px}
.grp .row.dragging{z-index:3;transition:none;background:var(--raised-c);box-shadow:0 8px 24px rgba(0,0,0,.28);border-radius:10px}
.toast{position:absolute;left:12px;right:12px;bottom:90px;z-index:6;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 8px 0 16px;border-radius:14px;background:var(--toast-bg);color:#fff;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.4,0,.2,1),opacity .2s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast button{margin-left:auto;border:0;background:transparent;color:var(--toast-act);font-weight:700;font-size:15px;min-height:44px;padding:0 10px;cursor:pointer}

/* ───────── таб-бар: скло + ПІДНЯТА капсула (A56) ───────── */
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);border-top:1px solid var(--glass-rim)}
.cap{position:absolute;top:6px;left:0;height:52px;width:0;border-radius:14px;opacity:0;pointer-events:none;background:var(--raised);box-shadow:var(--raised-sh);transition:transform var(--nav-dur) var(--nav-ease),width var(--nav-dur) var(--nav-ease)}
.cap.snap{transition:none}
.tab{flex:1;position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:600;color:var(--hint);cursor:pointer;transition:color .15s,transform 280ms cubic-bezier(.34,1.5,.64,1)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent-ink)}
.tab[hidden]{display:none}
/* шіт налаштувань (живе: Telegram ⋯ → «Налаштування», SettingsButton) */
.scrim{position:absolute;inset:0;z-index:8;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--page);border-radius:18px 18px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 22%,transparent);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:17px;text-align:center}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:transparent;padding:0 12px;font-size:16px;cursor:pointer;color:var(--text);text-align:left;border-radius:12px}
.sheet .opt[aria-current="true"]{background:var(--card);box-shadow:var(--card-sh)}
.sheet .opt .ava{width:34px;height:34px;font-size:15px}
.sheet .opt small{display:block;font-size:12px;color:var(--hint)}
.sheet [hidden]{display:none}
.pressing{transform:scale(.96);transition-duration:80ms!important}
.pill.pressing{transform:scale(.92)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ───────── v8 · «Місяць» — календар (Р-31 · Р-32 · Р-33) ───────── */
.phone[data-theme="graphite"]{--tile-top:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 55%);--tile-sh:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.35)}
.phone[data-theme="light"]{--tile-top:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);--tile-sh:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.08)}
.calc{padding:12px 10px 12px}
.cal-nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin:0 2px 10px}
.cal-nav b{font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-pill{margin:0;min-height:36px;padding:0 12px 0 8px;font-size:13px}.cal-pill.r{padding:0 8px 0 12px}.cal-pill.ghost{visibility:hidden}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;color:var(--hint);text-align:center;padding-bottom:2px}.cal-h.cur{color:var(--accent-ink);font-weight:700}
.cal-c{position:relative;border:0;border-radius:8px;min-height:52px;padding:6px 5px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;color:var(--text);min-width:0;overflow:hidden;text-align:left;font:inherit;transition:box-shadow .18s}
.cal-c.z{background-color:var(--well);box-shadow:var(--well-sh)}
.cal-c.h{background-color:color-mix(in srgb,var(--hist) var(--p,0%),var(--hist-zero));background-image:var(--tile-top);box-shadow:var(--tile-sh)}
.cal-c.fut{background:transparent;box-shadow:none;cursor:default}.cal-c.fut .cd{color:var(--hint);font-weight:400}
.cal-c.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-c.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)!important;z-index:1}
.cal-c .cd{font-size:12px;font-weight:500;line-height:1}
.cal-c .cv{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;line-height:1.1;font-variant-numeric:tabular-nums}
.cal-c .cv u{text-decoration:none;font-size:11px;font-weight:500}
.cal-foot{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--hint)}
.cal-foot i{width:16px;height:10px;border-radius:2px;background-color:color-mix(in srgb,var(--hist) var(--p),var(--hist-zero));background-image:var(--tile-top)}
.cal-foot i.z0{background:var(--well);box-shadow:var(--well-sh)}
.cal-foot .yr{margin-left:auto;display:inline-flex;align-items:center;min-height:26px;padding:0 11px;border-radius:999px;background:var(--well);box-shadow:var(--well-sh);font-size:13px;font-weight:600;color:var(--hint-well);font-variant-numeric:tabular-nums}
/* розклад робочого дня (Р-33) */
.dcard .dpad,.wday .dpad{padding:8px 16px 12px}
.agn{position:relative;margin:10px 0 6px}
.agn .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.agn .hr span{position:absolute;top:-8px;left:0;padding-right:6px;background-color:var(--card);font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.agn .blk{position:absolute;left:50px;right:0;display:flex;align-items:center;border-radius:8px;background-color:var(--hist);background-image:var(--tile-top);box-shadow:var(--tile-sh);color:var(--text);font-size:12px;font-weight:600;padding:0 8px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.phone[data-theme="graphite"] .agn .blk.now{background-color:var(--hist-now);color:#1c1c1e}
.phone[data-theme="light"] .agn .blk.now{background-color:var(--hist-now);color:#fff}
/* іконки вкладок — Lucide (ISC), тон-заливка активної (Р-31) */
.tabs svg.lu{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.tabs .tab[aria-selected="true"] svg .f{fill:currentColor;fill-opacity:.22}
@media (prefers-reduced-motion:reduce){.thumb,.cap,.tab,.pill,.btn,.toast,.sheet,.scrim,.grp .row{transition:none!important}.pressing{transform:none}}
</style>

<div class="stage">
  <main class="phone" id="app" data-theme="graphite" aria-label="Мокап Mini App AirLens">
    <div class="tg-bar"><button class="l" type="button" id="tgback" aria-label="Закрити">Закрити</button><span class="c" aria-hidden="true"><b>AirLens</b><small>міні-застосунок</small></span><button class="r" type="button" id="menu" aria-label="Налаштування">⋯</button></div>
    <div class="screens">
      <!-- ① ЗАРАЗ -->

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const app = $("#app");
  const S = { state: "alert", theme: "graphite", role: "admin", tab: "now", period: "day", who: "all", region: 2, obl: null, editing: false, mon: 1, sel: null };
  const NOW = 14 * 60 + 20, WF = 540, WT = 1080;

  // ───── синтетика (узгоджена доба; час мокапа 14:20) ─────
  const OBL = { "Дніпро": "Дніпропетровська", "Павлоград": "Дніпропетровська", "Кам’янське": "Дніпропетровська", "Самар": "Дніпропетровська", "Полтава": "Полтавська", "Кропивницький": "Кіровоградська" };
  let group = ["Дніпро", "Павлоград", "Кам’янське", "Самар", "Полтава", "Кропивницький"];
  const DAY = [
    [185, 230, ["Полтава"], "дрони", "громада"],
    [610, 635, ["Дніпро", "Павлоград", "Кам’янське", "Самар"], "балістика", "область"],
    [700, 747, ["Павлоград"], "дрони", "район"],
    [844, null, ["Павлоград"], "дрони", "район"],
    [856, null, ["Дніпро"], "балістика", "громада"],
  ];
  const WEEKD = ["Ср", "Чт", "Пт", "Сб", "Нд", "Пн", "Вт"];
  const WEEK = { all: [42, 0, 118, 0, 0, 64, 88], "Павлоград": [42, 0, 96, 0, 0, 40, 88], "Дніпро": [25, 0, 60, 0, 0, 38, 29], "Кам’янське": [25, 0, 52, 0, 0, 30, 25], "Самар": [25, 0, 50, 0, 0, 35, 25], "Полтава": [0, 0, 44, 0, 0, 30, 0], "Кропивницький": [0, 0, 21, 0, 0, 18, 0] };
  const WEEKN = { all: 14, "Павлоград": 9, "Дніпро": 7, "Кам’янське": 6, "Самар": 7, "Полтава": 3, "Кропивницький": 2 };
  const MONTH = { all: [1983, 126], "Павлоград": [790, 31], "Дніпро": [655, 27], "Кам’янське": [598, 24], "Самар": [640, 26], "Полтава": [322, 14], "Кропивницький": [187, 9] };
  const SCOPE = { "громада": "", "район": "весь район", "область": "вся область" };
  const LAST_END = { "Кам’янське": 635, "Самар": 635 };

  const hm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const durH = (m) => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}<span class="u"> год </span>${String(r).padStart(2, "0")}<span class="u"> хв</span>` : `${r}<span class="u"> хв</span>`; };
  const dur = (m) => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h} год ${String(r).padStart(2, "0")} хв` : `${r} хв`; };
  const plural = (n, a, b, c) => { const d = n % 10, t = n % 100; return d === 1 && t !== 11 ? a : d >= 2 && d <= 4 && (t < 12 || t > 14) ? b : c; };
  const ico = (s, cls = "") => `<svg class="${cls} i-${s}" aria-hidden="true"><use href="#s-${s}"/></svg>`;
  const clipW = (a, b) => Math.max(0, Math.min(b, WT) - Math.max(a, WF));

  function live() {
    if (S.state === "nodata" || S.state === "calm") return [];
    const act = DAY.filter((e) => e[1] === null).flatMap((e) => e[2].map((n) => ({ n, since: e[0], t: e[3], lvl: e[4] })));
    return (S.state === "yellow" ? act.filter((x) => x.n === "Павлоград").map((x) => ({ ...x, s: "yellow" })) : act.map((x) => ({ ...x, s: "alert" })))
      .filter((x) => group.includes(x.n)).sort((a, b) => group.indexOf(a.n) - group.indexOf(b.n));
  }

  // ───── ① Зараз ─────
  function renderNow() {
    const hits = live(), M = group.length, fr = $("#fresh"), stale = S.state === "nodata";
    fr.className = "fresh" + (stale ? " stale" : "");
    fr.innerHTML = `<svg aria-hidden="true"><use href="#i-clock"/></svg>дані на ${hm(stale ? NOW - 5 : NOW)}`;
    const h = $("#hero");
    if (hits.length) {
      const s = hits.every((x) => x.s === "yellow") ? "yellow" : "alert";
      h.dataset.s = s;
      h.innerHTML = `<div class="hero-top">${ico(s)}<div><h2>Тривога в ${hits.length} з ${M} ${plural(M, "громади", "громад", "громад")}</h2><p class="call">Пройдіть в укриття.</p></div></div>
        <div class="hits">${hits.map((x) => `<div class="hit"><div class="b"><div class="n">${x.n}</div><div class="t"><b>${x.t}</b>${SCOPE[x.lvl] ? `<span> · ${SCOPE[x.lvl]}</span>` : ""}</div></div>
        <div class="d"><b>${dur(NOW - x.since)}</b><small>з ${hm(x.since)}</small></div></div>`).join("")}</div>`;
    } else if (stale) {
      h.dataset.s = "nodata";
      h.innerHTML = `<div class="hero-top">${ico("nodata")}<div><h2>Нема свіжих даних</h2><p class="call">Орієнтуйтесь на сирену й офіційні застосунки.</p></div></div>`;
    } else {
      h.dataset.s = "calm";
      h.innerHTML = `<div class="hero-top">${ico("calm")}<div><h2>Без тривоги: усі ${M} ${plural(M, "громада", "громади", "громад")}</h2></div></div>`;
    }
    const inHero = new Set(hits.map((x) => x.n)), rest = group.filter((n) => !inHero.has(n));
    const st = stale ? "nodata" : "calm";
    const recent = (n) => (!stale && LAST_END[n] !== undefined && NOW - LAST_END[n] <= 60 ? `без тривоги ${dur(NOW - LAST_END[n])}` : "");
    const title = stale ? "Нема даних" : hits.length ? "Без тривоги" : "Громади";
    $("#others").innerHTML = rest.length ? `<div class="gap"></div><div class="gap"></div><div class="card"><div class="card-h"><span>${title}</span><span class="count">${rest.length} з ${M}</span></div>
      ${rest.map((n) => `<div class="row">${ico(st, "ic")}<span class="n">${n}</span><span class="v">${recent(n)}</span></div>`).join("")}</div>` : "";
  }
  function renderPins() {
    const hits = live();
    $$("[data-pin]").forEach((p) => {
      p.hidden = !hits.length; if (!hits.length) return;
      p.dataset.s = hits.every((x) => x.s === "yellow") ? "yellow" : "alert";
      p.innerHTML = `<button type="button" data-go="now">${ico(p.dataset.s)}<span>Тривога в ${hits.length} ${plural(hits.length, "громаді", "громадах", "громадах")} — в укриття</span><span class="go" aria-hidden="true">›</span></button>`;
    });
  }

  // ───── ② Звіти ─────
  function union(evs, clip) {
    const iv = evs.map((e) => [e[0], e[1] ?? NOW]).map(([a, b]) => (clip ? [Math.max(a, WF), Math.min(b, WT)] : [a, b])).filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
    let tot = 0, n = 0, cur = null;
    for (const [a, b] of iv) { if (!cur || a > cur[1]) { if (cur) tot += cur[1] - cur[0]; cur = [a, b]; n++; } else cur[1] = Math.max(cur[1], b); }
    if (cur) tot += cur[1] - cur[0];
    return { tot, n };
  }
  const bigDur = (m) => (m >= 60 ? `${Math.floor(m / 60)}<small> год </small>${String(m % 60).padStart(2, "0")}<small> хв</small>` : `${m}<small> хв</small>`);
  // підсумок читається згори вниз: що → скільки → частка (смужка) → кількість
  const rhero = (m, when, pct, cnt, base) => `<div class="card rhero"><div class="top"><span class="badge">${when}</span><span class="hours"><svg aria-hidden="true"><use href="#i-clock"/></svg>09:00–18:00</span></div>
      <div class="big">${bigDur(m)}</div><div class="k">тривоги в робочий час</div>
    <div class="meter" role="img" aria-label="${pct}% ${base}"><i style="width:${Math.min(100, pct)}%"></i></div>
    <div class="rmeta"><span><b>${pct}%</b> часу під тривогами</span><span><b>${cnt}</b> ${plural(cnt, "тривога", "тривоги", "тривог")}</span></div></div>`;
  function whoTray() {
    const t = $("#who"), items = [["all", "Усі"], ...group.map((n) => [n, n])];
    t.innerHTML = `<span class="thumb" aria-hidden="true"></span>` + items.map(([k, v]) => `<button class="tray-i" role="tab" data-v="${k}" aria-selected="${S.who === k}">${v}</button>`).join("");
  }
  const evOf = () => (S.who === "all" ? DAY : DAY.filter((e) => e[2].includes(S.who)).map((e) => [e[0], e[1], [S.who], e[3], e[4]]));
  function renderRep() {
    $("#rep-body").innerHTML = S.period === "day" ? repDay() : S.period === "week" ? repWeek() : repMonth();
  }
  function perHromada(rows) {
    if (S.who !== "all") return "";
    return `<div class="gap"></div><div class="card lst"><div class="card-h"><span>По громадах</span><span class="count">${rows.length}</span></div>${rows.map(([n, m, c]) =>
      `<button class="r" type="button" data-who="${n}"><span class="n">${n}<small>${c ? `${c} ${plural(c, "тривога", "тривоги", "тривог")}` : "без тривог"}</small></span><span class="v${m ? "" : " zero"}">${durH(m)}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`;
  }
  function repDay() {
    const ev = evOf(), all = union(ev, false), work = union(ev, true);
    const rows = group.map((n) => { const e = DAY.filter((x) => x[2].includes(n) && clipW(x[0], x[1] ?? NOW) > 0); return [n, e.reduce((a, x) => a + clipW(x[0], x[1] ?? NOW), 0), e.length]; }).sort((a, b) => b[1] - a[1]);   // лише робочий час (Р-33)
    const list = [...ev].filter((e) => clipW(e[0], e[1] ?? NOW) > 0).sort((a, b) => b[0] - a[0]).map((e) => {
      const b2 = e[1] ?? NOW, on = e[1] === null, off = clipW(e[0], b2) === 0;
      return `<div class="e${on ? " now" : ""}${off ? " off" : ""}"><span class="t">${hm(e[0])}–${on ? "зараз" : hm(b2)}</span><span class="w">${e[2].length > 2 ? `${e[2].length} ${plural(e[2].length, "громада", "громади", "громад")}` : e[2].join(", ")}</span><span class="d">${dur(b2 - e[0])}</span>
        <span class="s">${e[3]}${SCOPE[e[4]] ? ` · ${SCOPE[e[4]]}` : ""}${off ? " · поза робочим часом" : ""}</span></div>`;
    }).join("");
    const nIn = ev.filter((e) => clipW(e[0], e[1] ?? NOW) > 0).length;
    return rhero(work.tot, "Сьогодні", Math.round((work.tot / (NOW - WF)) * 100), work.n, "робочого часу з 09:00") +
      (S.who === "all" ? "" : `<div class="card wday" style="margin-top:12px"><div class="card-h"><span>Робочий день</span><span class="count">зараз ${hm(NOW)}</span></div><div class="dpad">${agenda(dayEv(S.who, AD))}</div></div>`) +
      perHromada(rows) + (nIn ? `<div class="gap"></div><div class="card evs"><div class="card-h"><span>Події</span><span class="count">${nIn}</span></div>${list}</div>` : "");
  }
  // ───── v8: синтетичні інтервали за 64 дні (генератор стейдж-бенча, AirLens/tools/bench) — «Тиждень» і «Місяць» рахуються з них ─────
  // хвилини від Пн 27.07.2026 00:00 (Київ); сьогодні — день 64 (вт 29.09), його тривоги — DAY вище
  const AD = 64, AN = AD * 1440 + NOW;
  const ymd = (d) => { const x = new Date(Date.UTC(2026, 6, 27 + d)); return [x.getUTCDate(), x.getUTCMonth() + 1, x.getUTCFullYear()]; };
  const ddmm = (d) => { const [a, b] = ymd(d); return `${a}.${String(b).padStart(2, "0")}`; };
  const DNI = ["Дніпро", "Павлоград", "Кам’янське", "Самар"];
  const EV = (() => {
    let x = 20260929 >>> 0; const r = () => ((x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296);
    const len = (a, b) => Math.round(a * Math.pow(b / a, r()));
    const DW = { 9: .9, 10: 1.0, 11: 1.1, 12: 1.4, 13: 1.2, 14: .8, 15: .45, 16: .35, 17: .7 };
    const dayStart = () => { let t = r() * 7.9; for (let h = 9; h <= 17; h++) { t -= DW[h]; if (t <= 0) return h * 60 + Math.floor(r() * 60); } return 17 * 60 + Math.floor(r() * 60); };
    const ev = [], add = (s, l, who) => ev.push([s, s + l, who]);
    for (let d = 0; d < AD; d++) {
      const b = d * 1440, wd = d % 7;
      if (r() < .5) add(b + 1290 + Math.floor(r() * 420), len(40, 150), DNI);
      if (r() < .22) add(b + 330 + Math.floor(r() * 240), len(20, 70), DNI);
      if (r() < .16 + (wd === 4 ? .14 : 0) + (wd === 0 ? .06 : 0)) add(b + dayStart(), len(20, 75), DNI);
      if (r() < .4) { const s = r() < .6 ? b + 1320 + Math.floor(r() * 360) : b + dayStart(), l = len(25, 120); r(); add(s, l, ["Павлоград"]); }
      if (r() < .1) { const s = r() < .5 ? b + 1320 + Math.floor(r() * 300) : b + dayStart(), l = len(20, 90); r(); add(s, l, ["Кам’янське"]); }
      if (r() < .12) add(b + dayStart(), len(12, 35), ["Дніпро"]);
      if (r() < .3) add(b + 1290 + Math.floor(r() * 400), len(40, 140), ["Полтава"]);
      if (r() < .12) add(b + dayStart(), len(20, 60), ["Полтава"]);
      if (r() < .18) add(b + 1300 + Math.floor(r() * 380), len(30, 120), ["Кропивницький"]);
      if (r() < .08) add(b + dayStart(), len(20, 50), ["Кропивницький"]);
    }
    for (const e of DAY) ev.push([AD * 1440 + e[0], e[1] === null ? null : AD * 1440 + e[1], e[2]]);
    return ev;
  })();
  function ivOf(who) {                                     // злиті інтервали (Р-30): «Усі» — будь-яка громада групи
    const iv = EV.filter((e) => (who === "all" ? e[2].some((n) => group.includes(n)) : e[2].includes(who))).map((e) => [e[0], e[1] ?? AN]).sort((a, b) => a[0] - b[0]);
    const out = []; for (const [a, b] of iv) { const l = out[out.length - 1]; if (l && a <= l[1]) l[1] = Math.max(l[1], b); else out.push([a, b]); } return out;
  }
  function workWin(who, a, b) {                            // лише робочий час (Р-33): хвилини, база, кількість тривог
    const iv = ivOf(who); let tot = 0, base = 0; const eps = new Set();
    for (let d = Math.floor(a / 1440); d * 1440 < b; d++) { if (d % 7 > 4) continue;
      const p = Math.max(d * 1440 + WF, a), q = Math.min(d * 1440 + WT, b); if (q <= p) continue; base += q - p;
      iv.forEach(([u, v], i) => { if (u < q && v > p) { tot += Math.min(v, q) - Math.max(u, p); eps.add(i); } }); }
    return { tot, base, n: eps.size };
  }
  function dayEv(who, d) {                                 // тривоги дня в робочому вікні: [початок, кінець, триває] (хв від початку доби)
    const a = d * 1440 + WF, b = Math.min(d * 1440 + WT, AN);
    return ivOf(who).filter(([p, q]) => p < b && q > a).map(([p, q]) => [Math.max(p, a) - d * 1440, Math.min(q, b) - d * 1440, q >= AN]);
  }
  const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"], FULL = ["Понеділок", "Вівторок", "Середа", "Четвер", "П’ятниця", "Субота", "Неділя"];

  // розклад робочого дня 09–18 (Р-33) — один компонент для «День» і картки дня в «Місяці»
  function agenda(evs) {

  function repWeek() {                                     // поточний тиждень Пн–Пт по порядку; майбутні дні порожні (вихідні — поза робочим часом, Р-33)

    const cap = Math.max(60, Math.ceil(Math.max(...w) / 30) * 30);

  const MONS = [[5, 35, "Серпень"], [36, 65, "Вересень"], [66, 96, "Жовтень"]];

    const cells = `<span></span>`.repeat(days[0] % 7) + days.map((d) => {

  }

  $("#scrim").addEventListener("click", () => { openSheet(false); openGroups(false); });
  let pressed = null; const release = () => { if (pressed) { pressed.classList.remove("pressing"); pressed = null; } };
  app.addEventListener("pointerdown", (e) => { const el = e.target.closest(".tab,.pill:not(.done),.btn,.pin button,.cal-pill"); if (el) { pressed = el; el.classList.add("pressing"); } });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => app.addEventListener(ev, release));
  $$(".seg-demo").forEach((g) => g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S[g.dataset.k] = b.dataset.v; $$("button", g).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); renderAll(); }));
  addEventListener("resize", () => requestAnimationFrame(() => placeAll(true)));

  const qs = new URLSearchParams(location.search);
  ["state", "role", "theme", "period", "who"].forEach((k) => { if (qs.get(k)) S[k] = qs.get(k); });
  $$(".seg-demo").forEach((g) => $$("button", g).forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === S[g.dataset.k]))));
  $$("#per .tray-i").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.v === S.period)));
  $$("#thm .tray-i").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.v === S.theme)));
  if (qs.get("edit")) S.editing = true;
  if (qs.get("sel")) S.sel = +qs.get("sel");
  if (qs.get("mon")) S.mon = +qs.get("mon");
  renderAll();
  go(qs.get("tab") || "now", true);
  if (qs.get("sheet")) openSheet(true);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => placeAll(true));
  // PREVIEW: service worker не реєструється.
})();
</script>
</body>
</html>
